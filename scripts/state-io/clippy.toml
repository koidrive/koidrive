disallowed-methods = [
    { path = "std::fs::write", reason = "Use koidrive_state_file::write for state files; the helper owns staging, publication and crash cleanup." },
    { path = "std::fs::rename", reason = "Use koidrive_state_file::AtomicFile for state publication; do not manage state-file temporary names here." },
    { path = "std::fs::copy", reason = "Use koidrive_state_file::write for state snapshots; direct copies bypass durable publication and cleanup." },
    { path = "std::fs::hard_link", reason = "Use koidrive_state_file::AtomicFile with Publish::Create for no-clobber state publication." },
    { path = "tokio::fs::write", reason = "Use koidrive_state_file::write in spawn_blocking for state files." },
    { path = "tokio::fs::rename", reason = "Use koidrive_state_file::AtomicFile in spawn_blocking for state publication." },
    { path = "tokio::fs::copy", reason = "Use koidrive_state_file::write in spawn_blocking for state snapshots." },
    { path = "tokio::fs::hard_link", reason = "Use koidrive_state_file::AtomicFile with Publish::Create in spawn_blocking." },
    { path = "tempfile::NamedTempFile::persist", reason = "Use koidrive_state_file::AtomicFile; NamedTempFile cannot recover stages after a killed writer." },
    { path = "tempfile::NamedTempFile::persist_noclobber", reason = "Use koidrive_state_file::AtomicFile with Publish::Create for durable no-clobber publication." },
    { path = "tempfile::TempPath::persist", reason = "Use koidrive_state_file::AtomicFile for durable publication and crash recovery." },
    { path = "tempfile::TempPath::persist_noclobber", reason = "Use koidrive_state_file::AtomicFile with Publish::Create for durable no-clobber publication." },
]
