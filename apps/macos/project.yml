#
# XcodeGen spec for Koidrive.xcodeproj. Generate the project with scripts/generate-project.sh.

name: Koidrive
options:
  bundleIdPrefix: dev.koidrive
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  KoidriveFFI:
    path: KoidriveFFI
targets:
  Koidrive:
    type: application
    platform: macOS
    sources:
      - Koidrive
    info:
      path: build/Info.plist
      properties:
        KoidriveVersion: $(KOIDRIVE_VERSION)
    dependencies:
      - package: KoidriveFFI
        product: KoidriveFFI
      - package: KoidriveFFI
        product: KoidriveModel
    postBuildScripts:
      - name: Embed koi
        inputFiles:
          - $(SRCROOT)/build/koi
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/koi
        script: |
          set -euo pipefail
          if [ ! -x "$SCRIPT_INPUT_FILE_0" ]; then
            echo "error: $SCRIPT_INPUT_FILE_0 is missing; run scripts/build-ffi.sh first."
            exit 1
          fi
          mkdir -p "$(dirname "$SCRIPT_OUTPUT_FILE_0")"
          cp "$SCRIPT_INPUT_FILE_0" "$SCRIPT_OUTPUT_FILE_0"
          if [ "$CODE_SIGNING_ALLOWED" = YES ]; then
            codesign --force --options runtime --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$SCRIPT_OUTPUT_FILE_0"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.koidrive.Koidrive
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Koidrive
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        MARKETING_VERSION: 0.0.0
        KOIDRIVE_VERSION: 0.0.0-dev
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        ONLY_ACTIVE_ARCH: YES
        CODE_SIGN_IDENTITY: "-"
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
  KoidriveUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - KoidriveUITests
    dependencies:
      - target: Koidrive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.koidrive.KoidriveUITests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
        CODE_SIGN_IDENTITY: "-"
        TEST_TARGET_NAME: Koidrive
schemes:
  Koidrive:
    build:
      targets:
        Koidrive: all
    test:
      config: Debug
      targets:
        - KoidriveUITests
