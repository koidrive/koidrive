# SPDX-License-Identifier: Apache-2.0

[package]
name = "koidrive-fs"
description = "File system watchers and local file access."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
getrandom = "0.4.3"
koidrive-ignore = { path = "../ignore" }
libc = "0.2.191"
notify = "8.2.2"
rustix = { version = "1.1.6", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
koidrive-engine = { path = "../engine" }
koidrive-test-support = { path = "../test-support" }
rustix = { version = "1.1.6", features = ["process", "system"] }
tempfile = "3.27.0"
