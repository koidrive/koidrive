# SPDX-License-Identifier: Apache-2.0

[package]
name = "koidrive-state-file"
description = "Atomic state-file publication and recovery of abandoned writes."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
test-hooks = []

[dependencies]
getrandom = "0.4.3"
rustix = { version = "1.1.6", features = ["fs", "process"] }
tracing = "0.1.41"

[dev-dependencies]
koidrive-test-support = { path = "../test-support" }
tempfile = "3.27.0"

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2.191"
