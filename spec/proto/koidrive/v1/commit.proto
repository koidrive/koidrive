syntax = "proto3";

package koidrive.v1;

import "koidrive/v1/model.proto";

// An intended change sent by a client.
message Op {
  oneof op {
    CreateDir create_dir = 1;
    CreateFile create_file = 2;
    UpdateContent update_content = 3;
    Move move = 4;
    Delete delete = 5;
    Restore restore = 6;
  }
}

message CreateDir {
  string node_id = 1;
  string parent_id = 2;
  string name = 3;
  // The name this folder waits to take while `name` stands in for it (RFC 0017).
  string pending_for = 4;
}

message CreateFile {
  string node_id = 1;
  string parent_id = 2;
  string name = 3;
  Content content = 4;
}

message UpdateContent {
  string node_id = 1;
  Content content = 2;
  // Set on an edit that sends again content another device made and the server lost, with no change of the sending
  // device's user in it. It leaves the node's edit_rev as it was, and a trashed target answers it with CODE_SUPERSEDED
  // (RFC 0018).
  bool resend = 3;
}

message Move {
  string node_id = 1;
  string new_parent_id = 2;
  string new_name = 3;
  // The name this node waits to take while `new_name` stands in for it (RFC 0017). A Move without it clears
  // the node's mark.
  string pending_for = 4;
  // When set, the move applies only while the node is live at this place and the new parent is live; otherwise it is
  // answered with CODE_SUPERSEDED and changes nothing (RFC 0019).
  Place from = 5;
}

// A place in the tree: a parent folder and a name in it.
message Place {
  string parent_id = 1;
  string name = 2;
}

message Delete {
  string node_id = 1;
  // When set, the delete applies only while this node is live at these revisions; otherwise it is answered with
  // CODE_SUPERSEDED and trashes nothing (RFC 0015).
  NodeRevisions requires = 2;
}

// A node at the revisions of its NodeState.
message NodeRevisions {
  string node_id = 1;
  uint64 content_rev = 2;
  uint64 meta_rev = 3;
}

message Restore {
  string node_id = 1;
  string version_id = 2;
  string target_parent_id = 3;
  string name = 4;
}

message UploadReceipt {
  bytes hash = 1;
  uint32 size = 2;
  string token = 3;
}

message Commit {
  string commit_id = 1;
  uint64 base_seq = 2;
  repeated Op ops = 3;
  repeated UploadReceipt receipts = 4;
  // The history the commit was built in. A commit for another history is refused with CODE_HISTORY_MISMATCH.
  string history_id = 5;
  // This device's commit slot: one more than its highest accepted device_seq. A retry keeps it.
  uint64 device_seq = 6;
  // When true, the commit is refused with CODE_HEAD_MOVED unless head_seq equals base_seq.
  bool require_head = 7;
  // Reserved for labelling the commits of one automated run (RFC 0006 section 4). Clients leave it empty, and servers
  // ignore it.
  string run_id = 8;
  // The commit token at base_seq (RFC 0013). Both empty when base_seq is 0 or the client does not know it. A server
  // that holds another commit at base_seq refuses the commit with CODE_AHEAD_OF_SERVER.
  string base_commit_id = 9;
  int64 base_committed_at_ms = 10;
}

message OpResult {
  enum Code {
    CODE_UNSPECIFIED = 0;
    CODE_APPLIED = 1;
    CODE_APPLIED_RENAMED = 2;
    CODE_CONFLICT_COPY = 3;
    CODE_MERGED_INTO = 4;
    CODE_SUPERSEDED = 5;
    CODE_REJECTED = 6;
  }
  Code code = 1;
  // ID of the conflict copy or of the directory merged into.
  string node_id = 2;
  // The name actually used.
  string name = 3;
  string reject_reason = 4;
}

message CommitResult {
  uint64 seq = 1;
  repeated OpResult results = 2;
  repeated ChangeRecord changes = 3;
  // When the server applied the commit at seq: with the commit's commit_id, the commit token at seq (RFC 0013).
  int64 committed_at_ms = 4;
}
