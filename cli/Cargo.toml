# SPDX-License-Identifier: Apache-2.0

[package]
name = "koidrive-cli"
description = "Koidrive command-line client and sync daemon."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "koi"
path = "src/main.rs"

[features]
test-install-inventory = []

[[test]]
name = "update"
required-features = ["test-install-inventory"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
cliclack = "0.5.7"
console = "0.16.6"
koidrive-cloudflare = { path = "../core/cloudflare" }
koidrive-driver = { path = "../core/driver" }
koidrive-engine = { path = "../core/engine" }
koidrive-fs = { path = "../core/fs" }
koidrive-ipc = { path = "../core/ipc" }
koidrive-net = { path = "../core/net" }
koidrive-proto = { path = "../core/proto" }
koidrive-telemetry = { path = "../core/telemetry" }
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false }
rustix = { version = "1.1.6", features = ["fs", "net", "process", "pty", "stdio", "system", "termios"] }
serde = { version = "1.0.229", features = ["derive"] }
schemars = "1.2.3"
serde_json = "1.0.154"
semver = "1.0.28"
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.48", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5.8"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"
plist = { version = "1.10.3", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "6.2.1", default-features = false, features = ["tokio"] }

[build-dependencies]
serde_json = "1.0.154"

[dev-dependencies]
bytes = "1.12.1"
fastrand = "2"
koidrive-chunk = { path = "../core/chunk" }
koidrive-store = { path = "../core/store" }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
jsonschema = { version = "0.61.2", default-features = false }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
prost.workspace = true
reqwest = { version = "0.13.5", default-features = false }
tokio = { version = "1.48", features = ["full", "test-util"] }
url = "2.5.8"
