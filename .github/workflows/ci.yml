# SPDX-License-Identifier: Apache-2.0

name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      rust_macos: ${{ steps.paths.outputs.rust_macos }}
      server_macos: ${{ steps.paths.outputs.server_macos }}
      spec_macos: ${{ steps.paths.outputs.spec_macos }}
      macos_app: ${{ steps.paths.outputs.macos_app }}
      runner_hook: ${{ steps.paths.outputs.runner_hook }}
      site_only: ${{ steps.paths.outputs.site_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Decide which jobs the change needs
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.merge_group.base_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = push ]; then
            echo "site_only=false" >> "$GITHUB_OUTPUT"
            api() {
              curl -fsS --max-time 15 -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/$1"
            }
            passed=""
            if ! runs="$(api "workflows/ci.yml/runs?event=merge_group&head_sha=$GITHUB_SHA&status=success&per_page=1")" || ! run="$(jq -ec '.workflow_runs | if type == "array" then .[0] // {} else error("no workflow_runs") end' <<<"$runs")"; then
              echo "::warning::Looking up the merge queue run of $GITHUB_SHA failed (see the error above), so every macOS job runs."
            elif [ "$run" = '{}' ]; then
              echo "No successful merge queue run of ci.yml tested $GITHUB_SHA, so every macOS job runs."
            elif ! jobs="$(api "runs/$(jq -r .id <<<"$run")/jobs?filter=latest&per_page=100")" || ! passed="$(jq -er '.jobs | if type == "array" then map(select(.conclusion == "success") | .name) | join("\n") else error("no jobs") end' <<<"$jobs")"; then
              passed=""
              echo "::warning::Listing the jobs of merge queue run $(jq -r .html_url <<<"$run") failed (see the error above), so every macOS job runs."
            else
              echo "Merge queue run $(jq -r .html_url <<<"$run") passed CI on $GITHUB_SHA."
              echo "Merge queue run $(jq -r .html_url <<<"$run") tested this commit. macOS jobs it passed are skipped here." >> "$GITHUB_STEP_SUMMARY"
            fi
            for pair in "rust_macos:rust (macos)" "server_macos:server (macos)" "spec_macos:spec (macos)" "macos_app:macos app" "runner_hook:runner hook"; do
              covered=true
              if [ "${pair%%:*}" = rust_macos ]; then
                for suite in driver engine sim; do
                  if ! grep -Fxq "rust tests (macos, $suite)" <<<"$passed"; then covered=false; fi
                done
              fi
              if [ "$covered" = true ] && grep -Fxq "${pair#*:}" <<<"$passed"; then
                echo "${pair%%:*}: covered, because the merge queue run passed ${pair#*:} on this commit"
                echo "${pair%%:*}=covered" >> "$GITHUB_OUTPUT"
              else
                echo "${pair%%:*}: runs, because no merge queue run passed ${pair#*:} on this commit"
                echo "${pair%%:*}=true" >> "$GITHUB_OUTPUT"
              fi
            done
            exit 0
          fi
          if [ "$EVENT" = merge_group ]; then
            git fetch --no-tags --depth=1 origin "$BASE"
          else
            BASE=$(git rev-parse HEAD^1)
          fi
          if ! git diff -z --name-only --no-renames "$BASE" HEAD > "$RUNNER_TEMP/changed"; then
            echo "::error::git diff between $BASE and HEAD failed, so the changed paths are unknown."
            exit 1
          fi
          changed="$(tr '\0' '\n' < "$RUNNER_TEMP/changed")"
          echo "Files this $EVENT run changes against $BASE:"
          printf '%s\n' "$changed"
          if [ -n "$changed" ] && ! grep -qv '^site/' <<<"$changed"; then
            echo "site_only: true, because every changed file is under site/, so the build and test jobs skip."
            printf '%s=false\n' rust_macos server_macos spec_macos macos_app runner_hook >> "$GITHUB_OUTPUT"
            echo "site_only=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "site_only: false, because a changed file is outside site/."
          echo "site_only=false" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = merge_group ]; then
            echo "Merge queue run: every macOS job runs."
            printf '%s=true\n' rust_macos server_macos spec_macos macos_app runner_hook >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash scripts/test-macos-changes.sh
          if ! macos="$(scripts/macos-changes.sh "$BASE" HEAD)"; then
            echo "::error::Listing the macOS-specific files between $BASE and HEAD failed (see the error above)."
            exit 1
          fi
          echo "Files this pull request changes that can build or behave differently on macOS:"
          printf '%s\n' "${macos:-none}"
          decide() {
            if [ -n "$(tr -d '[:space:]' <<<"$3")" ]; then
              echo "$1: runs, because of $(tr '\n' ' ' <<<"$3")"
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1: skipped, because $2. The merge queue runs it."
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          workflow="$(grep -E '^(\.github/workflows/ci\.yml$|\.github/actions/self-hosted-rust/|scripts/(test-)?macos-changes\.sh$)' <<<"$changed" || true)"
          decide rust_macos "no macOS-specific Rust input changed" "$(cut -f1 <<<"$macos" | grep -v '^apps/macos/' || true)"$'\n'"$workflow"
          decide macos_app "neither the app nor a macOS-specific input of the core changed" "$(cut -f1 <<<"$macos" | grep -v '^cli/' || true)"$'\n'"$workflow"
          decide runner_hook "neither the runner hook nor ci.yml changed" "$(grep -E '^\.github/(runner/|workflows/ci\.yml$)' <<<"$changed" || true)"
          for job in server_macos spec_macos; do
            decide "$job" "ci.yml did not change" "$(grep -Fx '.github/workflows/ci.yml' <<<"$changed" || true)"
          done
      - name: Keep merged store migrations unchanged
        if: github.event_name != 'push'
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ "$EVENT" = merge_group ]; then
            git fetch --no-tags --depth=1 origin "$BASE"
          else
            BASE=$(git rev-parse HEAD^1)
          fi
          if ! changed="$(git diff --name-only --no-renames --diff-filter=DMT "$BASE" HEAD -- core/store/migrations)"; then
            echo "::error::git diff between $BASE and HEAD failed, so changes to merged store migrations are unknown."
            exit 1
          fi
          if [ -n "$changed" ]; then
            while read -r file; do
              echo "::error file=$file::$file is a merged store migration. Stores may have applied it already, so add a new migration instead of changing or removing this one."
            done <<<"$changed"
            exit 1
          fi
          if git cat-file -e "$BASE:core/store/migrations/legacy" 2>/dev/null; then
            if ! added="$(git diff --name-only --no-renames --diff-filter=A "$BASE" HEAD -- core/store/migrations/legacy)"; then
              echo "::error::git diff between $BASE and HEAD failed, so additions to the legacy store migrations are unknown."
              exit 1
            fi
            if [ -n "$added" ]; then
              while read -r file; do
                echo "::error file=$file::$file adds a legacy store migration. Legacy steps map positional schema versions, so add the migration as core/store/migrations/<name>.sql instead."
              done <<<"$added"
              exit 1
            fi
          fi
          echo "No merged store migration changed."

  pick-macos:
    name: pick-macos
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      macos_app: ${{ steps.pick.outputs.macos_app }}
      rust: ${{ steps.pick.outputs.rust }}
      rust_driver: ${{ steps.pick.outputs.rust_driver }}
      rust_engine: ${{ steps.pick.outputs.rust_engine }}
      rust_sim: ${{ steps.pick.outputs.rust_sim }}
      server: ${{ steps.pick.outputs.server }}
      spec: ${{ steps.pick.outputs.spec }}
      runner_hook: ${{ steps.pick.outputs.runner_hook }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test the macOS runner picker
        run: python3 scripts/test-pick-macos.py -v
      - name: Test Rust partition coverage
        run: python3 scripts/test-ci-rust-partitions.py RustPartitions -v
      - name: Pick a runner for each macOS job
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          RUNS_ON: ${{ vars.MACOS_RUNS_ON || '["self-hosted","flarebox-mini"]' }}
          RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          WANTED: macos_app=${{ needs.changes.outputs.macos_app }} rust=${{ needs.changes.outputs.rust_macos }} rust_driver=${{ needs.changes.outputs.rust_macos }} rust_engine=${{ needs.changes.outputs.rust_macos }} rust_sim=${{ needs.changes.outputs.rust_macos }} server=${{ needs.changes.outputs.server_macos }} spec=${{ needs.changes.outputs.spec_macos }} runner_hook=${{ needs.changes.outputs.runner_hook }}
        run: |
          hosted='["macos-15"]'
          api() {
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Counting the hosted macOS jobs took more than 90 seconds." >&2
              return 1
            fi
            curl -fsS --max-time 15 -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$GITHUB_API_URL/repos/$REPO/actions/$1"
          }
          count_hosted() {
            local deadline=$((SECONDS + 90)) status p page got c ids="" id n=0
            for status in queued in_progress; do
              p=1
              while :; do
                page="$(api "runs?status=$status&per_page=100&page=$p")" || return 1
                got="$(jq -er '.workflow_runs | if type == "array" then length else error("no workflow_runs") end' <<<"$page")" || return 1
                ids="$ids $(jq -r '.workflow_runs[].id' <<<"$page")"
                [ "$got" = 100 ] || break
                p=$((p + 1))
              done
            done
            for id in $(tr -s ' ' '\n' <<<"$ids" | sort -un); do
              p=1
              while :; do
                page="$(api "runs/$id/jobs?filter=latest&per_page=100&page=$p")" || return 1
                got="$(jq -er '.jobs | if type != "array" then error("no jobs") else "\(length) \([.[] | select(.status != "completed") | [.labels[] | ascii_downcase] | select((index("self-hosted") | not) and any(.[]; startswith("macos-") or . == "xcode-27"))] | length)" end' <<<"$page")" || return 1
                read -r got c <<<"$got"
                n=$((n + c))
                [ "$got" = 100 ] || break
                p=$((p + 1))
              done
            done
            echo "$n"
          }
          pool=false
          idle=n/a
          online=n/a
          total=n/a
          if [ "$EVENT" = pull_request ] && { [ "$REPO" != koidrive/koidrive ] || [ "$HEAD_REPO" != "$REPO" ]; }; then
            reason="Pull request in $REPO from ${HEAD_REPO:-a deleted repository}: its macOS jobs run on GitHub-hosted runners."
            RUNS_ON=$hosted
          elif ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string")' <<<"$RUNS_ON" >/dev/null 2>&1; then
            echo "::error::The MACOS_RUNS_ON variable must be a JSON array of runner labels, such as [\"xcode-27\"], but it is: $RUNS_ON"
            exit 1
          elif [ "$EVENT" != pull_request ]; then
            reason="A $EVENT run keeps the configured macOS runners."
          elif ! jq -e 'map(ascii_downcase) | index("self-hosted")' <<<"$RUNS_ON" >/dev/null; then
            reason="MACOS_RUNS_ON is $RUNS_ON, which names no self-hosted runner, so there is nothing to pool."
          elif [ -z "$RUNNER_STATUS_TOKEN" ]; then
            reason="The RUNNER_STATUS_TOKEN secret is not set, so the self-hosted runners cannot be checked and every macOS job runs on GitHub-hosted runners."
            RUNS_ON=$hosted
          elif ! runners="$(curl -fsS --max-time 15 -H "Authorization: Bearer $RUNNER_STATUS_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$GITHUB_API_URL/repos/$REPO/actions/runners?per_page=100")"; then
            reason="Listing the self-hosted runners failed (see the curl error above), so every macOS job runs on GitHub-hosted runners."
            RUNS_ON=$hosted
          elif ! counts="$(jq -er --argjson want "$RUNS_ON" '[.runners[] | select(($want | map(ascii_downcase)) - [.labels[].name | ascii_downcase] == [])] | "\(map(select(.status == "online" and .busy == false)) | length) \(map(select(.status == "online")) | length) \(length)"' <<<"$runners" 2>&1)"; then
            reason="The runner list is not in the expected shape ($counts), so every macOS job runs on GitHub-hosted runners."
            RUNS_ON=$hosted
          else
            read -r idle online total <<<"$counts"
            if [ "$online" = 0 ]; then
              reason="None of the $total self-hosted runners labelled $RUNS_ON is online, so every macOS job runs on GitHub-hosted runners."
              RUNS_ON=$hosted
            else
              pool=true
              reason="$idle of the $total self-hosted runners labelled $RUNS_ON are online and idle, and $online are online."
            fi
          fi
          RUNS_ON="$(jq -c . <<<"$RUNS_ON")"
          wanted_jobs=0
          for job in macos_app rust rust_driver rust_engine rust_sim server spec runner_hook; do
            case " $WANTED " in *" $job=true "*) wanted_jobs=$((wanted_jobs + 1)) ;; esac
          done
          hosted_cap=5
          hosted_load=n/a
          if [ "$pool" = true ] && [ "$wanted_jobs" -gt "$idle" ]; then
            if hosted_load="$(count_hosted)"; then
              reason="$reason $hosted_load hosted macOS jobs of this repository are queued or running. A job without an idle self-hosted runner runs on GitHub-hosted runners while that count is below $hosted_cap, and queues for a self-hosted runner otherwise."
            else
              hosted_load=unknown
              reason="$reason Counting the hosted macOS jobs failed (see the error above), so every job without an idle self-hosted runner runs on GitHub-hosted runners."
            fi
          fi
          echo "$reason"
          {
            echo "### macOS runners"
            echo
            echo "$reason"
            echo
            echo "| Job | Runs | Runner labels | DEVELOPER_DIR |"
            echo "| --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          to_self_hosted=0
          to_hosted=0
          idle_left=$idle
          hosted_busy=$hosted_load
          for job in macos_app rust rust_driver rust_engine rust_sim server spec runner_hook; do
            case " $WANTED " in
              *" $job=true "*) wanted=true ;;
              *) wanted=false ;;
            esac
            runs_on=$RUNS_ON
            if [ "$pool" = true ]; then
              if [ "$wanted" != true ]; then
                runs_on=$hosted
              elif [ "$idle_left" -gt 0 ]; then
                idle_left=$((idle_left - 1))
              elif [ "$hosted_busy" = unknown ]; then
                runs_on=$hosted
              elif [ "$hosted_busy" -lt "$hosted_cap" ]; then
                runs_on=$hosted
                hosted_busy=$((hosted_busy + 1))
              fi
            fi
            if jq -e 'map(ascii_downcase) | index("self-hosted")' <<<"$runs_on" >/dev/null; then
              developer_dir=/Applications/Xcode.app/Contents/Developer
              if [ "$wanted" = true ]; then to_self_hosted=$((to_self_hosted + 1)); fi
            else
              runs_on=$hosted
              developer_dir=""
              if [ "$job" = macos_app ]; then
                runs_on='["xcode-27"]'
                developer_dir=/Applications/Xcode_27.2.app/Contents/Developer
              fi
              if [ "$wanted" = true ]; then to_hosted=$((to_hosted + 1)); fi
            fi
            echo "$job: runs $wanted, on $runs_on with DEVELOPER_DIR=$developer_dir"
            echo "| $job | $wanted | \`$runs_on\` | \`$developer_dir\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "$job=$(jq -nc --argjson runs_on "$runs_on" --arg developer_dir "$developer_dir" '{runs_on: $runs_on, developer_dir: $developer_dir}')" >> "$GITHUB_OUTPUT"
          done
          decision="pick-macos: event=$EVENT pooled=$pool idle=$idle online=$online total=$total hosted_load=$hosted_load hosted_cap=$hosted_cap to_self_hosted=$to_self_hosted to_hosted=$to_hosted"
          echo "$decision"
          printf '\n%s\n' "$decision" >> "$GITHUB_STEP_SUMMARY"

  rust:
    name: rust (${{ matrix.os }})
    needs: [changes, pick-macos]
    if: needs.changes.outputs.site_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.rust_macos == 'true' && '["ubuntu-latest","macos"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os == 'macos' && fromJSON(needs.pick-macos.outputs.rust).runs_on || matrix.os }}
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: ${{ matrix.os == 'macos' && fromJSON(needs.pick-macos.outputs.rust).developer_dir || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Homebrew's rustup with rustup and Cargo homes and a target directory private to this self-hosted runner
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/self-hosted-rust
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: runner.environment != 'self-hosted'
      - name: Verify Rust workspace feature parity
        run: python3 scripts/test-ci-rust-partitions.py FeatureParity -v
      - name: List the remaining test inventory
        run: |
          out="$RUNNER_TEMP/test-inventory"
          mkdir -p "$out"
          cargo test --workspace --exclude koidrive-driver --exclude koidrive-engine --exclude koidrive-sim --locked --features koidrive-cli/test-install-inventory,koidrive-cli/test-setup -- --list --format terse > "$out/remainder.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rust-test-inventory-${{ matrix.os }}
          path: ${{ runner.temp }}/test-inventory
          if-no-files-found: error
          retention-days: 7
      - run: cargo test --workspace --exclude koidrive-driver --exclude koidrive-engine --exclude koidrive-sim --locked --features koidrive-cli/test-install-inventory,koidrive-cli/test-setup
      - name: Test the regression-case splitter
        run: |
          python3 scripts/test-split-proptest-regressions.py -v
          LC_ALL=C PYTHONUTF8=0 PYTHONCOERCECLOCALE=0 python3 scripts/test-split-proptest-regressions.py -v
      - name: Replay saved property regressions without random cases
        env:
          PROPTEST_CASES: '0'
        run: |
          cargo test --locked -p koidrive-chunk --test chunking -- --show-output
          cargo test --locked -p koidrive-ignore --test properties --test git_oracle -- --show-output
          cargo test --locked -p koidrive-net --lib -- --show-output

  rust-tests:
    name: rust tests (${{ matrix.os }}, ${{ matrix.suite }})
    needs: [changes, pick-macos]
    if: needs.changes.outputs.site_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.rust_macos == 'true' && '["ubuntu-latest","macos"]' || '["ubuntu-latest"]') }}
        suite: [driver, engine, sim]
    runs-on: ${{ matrix.os == 'macos' && fromJSON(needs.pick-macos.outputs[format('rust_{0}', matrix.suite)]).runs_on || matrix.os }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: ${{ matrix.os == 'macos' && fromJSON(needs.pick-macos.outputs[format('rust_{0}', matrix.suite)]).developer_dir || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use Homebrew's rustup with rustup and Cargo homes and a target directory private to this self-hosted runner
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/self-hosted-rust
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        if: runner.environment != 'self-hosted'
        with:
          key: ${{ matrix.suite }}
      - if: matrix.suite == 'engine'
        run: cargo fmt --all --check
      - if: matrix.suite == 'engine'
        run: cargo clippy --workspace --all-targets --locked --features koidrive-cli/test-install-inventory,koidrive-cli/test-setup -- -D warnings
      - name: Require per-seed persistence for every property test
        if: matrix.suite == 'engine'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/check-proptest-persistence-target
        run: |
          nice -n 10 cargo fmt --manifest-path scripts/check-proptest-persistence/Cargo.toml --check
          nice -n 10 cargo clippy --manifest-path scripts/check-proptest-persistence/Cargo.toml --all-targets --locked -- -D warnings
          nice -n 10 cargo test --manifest-path scripts/check-proptest-persistence/Cargo.toml --locked
          nice -n 10 cargo run --manifest-path scripts/check-proptest-persistence/Cargo.toml --locked --
      - name: Test the scenario splitter
        if: matrix.suite == 'engine'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/test-split-target
        run: |
          nice -n 10 cargo fmt --manifest-path scripts/test-split/Cargo.toml --check
          nice -n 10 cargo clippy --manifest-path scripts/test-split/Cargo.toml --all-targets --locked -- -D warnings
          python3 scripts/test-split/test_split.py -v
      - name: List the package test inventory
        env:
          SUITE: ${{ matrix.suite }}
          FEATURES: ${{ matrix.suite == 'engine' && 'serde' || matrix.suite == 'sim' && 'koidrive-engine/serde' || '' }}
        run: cargo test --locked -p "koidrive-$SUITE" --features "$FEATURES" -- --list --format terse > "$RUNNER_TEMP/inventory.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rust-test-inventory-${{ matrix.os }}-${{ matrix.suite }}
          path: ${{ runner.temp }}/inventory.txt
          if-no-files-found: error
          retention-days: 7
      - name: Run the package tests and doctests
        env:
          SUITE: ${{ matrix.suite }}
          FEATURES: ${{ matrix.suite == 'engine' && 'serde' || matrix.suite == 'sim' && 'koidrive-engine/serde' || '' }}
        run: cargo test --locked -p "koidrive-$SUITE" --features "$FEATURES"
      - name: Replay saved engine property regressions without random cases
        if: matrix.suite == 'engine'
        env:
          PROPTEST_CASES: '0'
        run: cargo test --locked -p koidrive-engine --test names --test trees --test effects -- --show-output
      - name: Replay saved driver property regressions without random cases
        if: matrix.suite == 'driver'
        env:
          PROPTEST_CASES: '0'
        run: cargo test --locked -p koidrive-driver --lib batches_leave_l_a_tree_that_holds_the_disk -- --show-output
      - name: Replay saved sim property regressions without random cases
        if: matrix.suite == 'sim'
        env:
          PROPTEST_CASES: '0'
        run: cargo test --locked -p koidrive-sim --test devices --test engine_sync --test space_properties -- --show-output
      - name: Test that the app installer refuses an app signed by a forged Developer ID
        if: matrix.os == 'macos' && matrix.suite == 'driver'
        run: |
          security list-keychains -d user
          cargo test --locked -p koidrive-cli --bin koi --features koidrive-cli/test-install-inventory -- --ignored --exact app_install::macos::tests::native_codesign_refuses_an_app_and_updater_signed_by_a_forged_developer_id
          security list-keychains -d user
      - name: Test release updates with a tag-derived version
        if: matrix.suite == 'driver'
        run: |
          python3 scripts/stamp-release-version.py v0.1.0-alpha.1
          nice -n 10 cargo test --locked -p koidrive-cli --test update --features koidrive-cli/test-install-inventory

  server:
    name: server (${{ matrix.os }})
    needs: [changes, pick-macos]
    if: needs.changes.outputs.site_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.server_macos == 'true' && '["ubuntu-latest","macos"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os == 'macos' && fromJSON(needs.pick-macos.outputs.server).runs_on || matrix.os }}
    env:
      DEVELOPER_DIR: ${{ matrix.os == 'macos' && fromJSON(needs.pick-macos.outputs.server).developer_dir || '' }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: server/package.json
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test --reporter=verbose
      - name: Test the deploy-test scripts without a deployment
        run: pnpm exec vitest run --config scripts/deploy-test/vitest.config.ts --reporter=verbose run.unit e2e.unit load.unit bench.unit

  server-deploy:
    name: server deploy check
    needs: changes
    if: needs.changes.outputs.site_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - name: Check the committed standalone release version before generating it
        run: node --test server/scripts/check-release-version.mjs
      - name: Keep KOIDRIVE_FEATURES out of the tracked Worker config
        run: |
          if grep -n KOIDRIVE_FEATURES server/wrangler.jsonc; then
            echo "::error file=server/wrangler.jsonc::KOIDRIVE_FEATURES is for test deployments, which pass it at deploy time. Every new deployment copies server/wrangler.jsonc, so it must not set it (RFC 0022 §3 rule 7)."
            exit 1
          fi
      - name: Deploy a copy of server/ on its own (dry run, then wrangler dev and a claim)
        run: node server/scripts/check-deploy.mjs
      - name: Install server dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile
      - name: Pack the server bundle that the CLI embeds
        run: node server/scripts/pack-bundle.mjs "$RUNNER_TEMP/server-bundle"
      - name: Check that the packer replaces nothing in its output
        run: node --test server/scripts/check-pack-bundle.mjs

  net-integration:
    name: net integration (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.site_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: server
      - name: Test koidrive-net against the Worker under wrangler dev
        run: core/net/scripts/integration-test.sh

  driver-integration:
    name: driver integration (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.site_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: server
      - name: Test two drivers against the Worker under wrangler dev
        run: core/driver/scripts/integration-test.sh

  cli-integration:
    name: cli integration (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.site_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: server
      - name: Start a systemd user instance for the runner user
        run: |
          sudo loginctl enable-linger "$USER"
          runtime="/run/user/$(id -u)"
          for _ in $(seq 1 100); do
            if [ -S "$runtime/systemd/private" ]; then break; fi
            sleep 0.2
          done
          XDG_RUNTIME_DIR="$runtime" systemctl --user show-environment > /dev/null
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          echo "KOIDRIVE_TEST_SYSTEMD=1" >> "$GITHUB_ENV"
      - name: Test the koi command and daemon against the Worker under wrangler dev
        run: cli/scripts/integration-test.sh

  ffi-integration:
    name: ffi integration (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.site_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: server
      - name: Test the app's session against the Worker under wrangler dev
        run: core/ffi/scripts/integration-test.sh

  spec:
    name: spec (${{ matrix.os }})
    needs: [changes, pick-macos]
    if: needs.changes.outputs.site_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.spec_macos == 'true' && '["ubuntu-latest","macos"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os == 'macos' && fromJSON(needs.pick-macos.outputs.spec).runs_on || matrix.os }}
    env:
      DEVELOPER_DIR: ${{ matrix.os == 'macos' && fromJSON(needs.pick-macos.outputs.spec).developer_dir || '' }}
    defaults:
      run:
        working-directory: spec
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          version: 1.75.0
          setup_only: true
      - run: buf lint
      - name: Check generated code is up to date
        run: |
          buf generate
          if ! git diff --exit-code -- ../server/src/gen ../core/proto/src/gen || [ -n "$(git status --porcelain -- ../server/src/gen ../core/proto/src/gen)" ]; then
            echo "::error::Generated code in server/src/gen or core/proto/src/gen is out of date. Run 'buf generate' in spec/ and commit the result."
            git status --short -- ../server/src/gen ../core/proto/src/gen
            exit 1
          fi
      - name: Check for breaking changes against the base
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.merge_group.base_sha || 'refs/heads/main' }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            BASE=$(git rev-parse HEAD^1)
            git update-ref refs/remotes/origin/breaking-base "$BASE"
          else
            git fetch --no-tags --depth=1 origin "+$BASE:refs/remotes/origin/breaking-base"
          fi
          if ! buf breaking --against "../.git#ref=refs/remotes/origin/breaking-base,subdir=spec"; then
            echo "::error::The schema in spec/proto breaks compatibility with the base $BASE (see the buf output above). Keep field numbers, names and types stable; reserve removed fields instead of deleting them."
            exit 1
          fi

  macos-app:
    name: macos app
    needs: [changes, pick-macos]
    if: needs.changes.outputs.macos_app == 'true'
    runs-on: ${{ fromJSON(needs.pick-macos.outputs.macos_app).runs_on }}
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: ${{ fromJSON(needs.pick-macos.outputs.macos_app).developer_dir }}
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Homebrew's rustup with rustup and Cargo homes and a target directory private to this self-hosted runner
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/self-hosted-rust
      - name: Test notarize.sh against a stub notarytool
        run: scripts/test-notarize.sh
      - name: Test release verification rejects missing tickets and unnotarized artifacts
        run: nice -n 10 bash scripts/test-verify-release.sh
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: runner.environment != 'self-hosted'
      - name: Show Xcode and Swift versions
        run: xcodebuild -version && swift --version
      - name: Build the Rust core, the Swift bindings and the app (unsigned)
        run: scripts/build-release.sh
      - name: Test the Swift bindings
        run: swift test --package-path KoidriveFFI
      - name: Test the Swift bindings in the release configuration, which has no DEBUG condition
        run: swift test --package-path KoidriveFFI -c release
      - name: Run the UI tests against the fake core
        timeout-minutes: 15
        run: |
          set -o pipefail
          if ! automationmodetool | grep -q "DOES NOT REQUIRE"; then
            echo "::error::UI tests need Automation Mode without authentication on this runner. Run 'sudo automationmodetool enable-automationmode-without-authentication' on it once, or run this job on a hosted runner."
            exit 1
          fi
          xcodebuild test -project Koidrive.xcodeproj -scheme Koidrive -configuration Debug \
            -derivedDataPath build/DerivedData -destination "platform=macOS,arch=$(uname -m)" \
            -resultBundlePath build/UITests.xcresult CODE_SIGN_IDENTITY=- 2>&1 | tee build/uitests.log
          grep -E "Test Case .*(passed|failed)|Executed [0-9]+ test" build/uitests.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: Koidrive-uitests
          path: apps/macos/build/UITests.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Check the app bundle
        run: plutil -p build/release/Koidrive.app/Contents/Info.plist
      - name: Sign the app ad hoc (pull requests are never signed with the Developer ID)
        run: scripts/sign-app.sh build/release/Koidrive.app -
      - name: Test login-item lifecycle commands without starting the UI
        run: nice -n 10 bash scripts/test-login-item-lifecycle.sh build/release/Koidrive.app
      - name: Package the disk image
        run: scripts/make-dmg.sh build/release/Koidrive.app build/release/Koidrive-unsigned.dmg
      - name: Verify the disk image
        run: |
          scripts/verify-release.sh build/release/Koidrive-unsigned.dmg unsigned
          echo "Unsigned build: pull requests and the merge queue never sign or notarize. SHA-256 $(shasum -a 256 build/release/Koidrive-unsigned.dmg | cut -d ' ' -f 1)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Koidrive-unsigned
          path: apps/macos/build/release/Koidrive-unsigned.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  runner-hook:
    name: runner hook
    needs: [changes, pick-macos]
    if: needs.changes.outputs.runner_hook == 'true'
    runs-on: ${{ fromJSON(needs.pick-macos.outputs.runner_hook).runs_on }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the job-started hook of the self-hosted runners
        run: .github/runner/test-job-started.sh
      - name: Test the hook's installer without root
        run: .github/runner/test-install-hook.sh

  installer:
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install shell test tools on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck zsh fish
      - name: Install shell test tools on macOS
        if: runner.os == 'macOS'
        run: brew install shellcheck fish
      - name: Check installer syntax and lint
        run: |
          nice -n 10 sh -n install.sh
          nice -n 10 sh -n scripts/test-install.sh
          nice -n 10 shellcheck -s sh install.sh scripts/test-install.sh
      - name: Test isolated installer journeys
        run: nice -n 10 python3 scripts/test-install-journey.py -v

  comments:
    name: comments
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Test the new-comment check
        run: python3 scripts/test-check-new-comments.py -v
      - name: Test the design-document splitter
        run: python3 scripts/test-split-sync-design.py -v
      - name: Fail on comments that this change adds
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ "$EVENT" = merge_group ]; then
            git fetch --no-tags --depth=1 origin "$BASE"
          else
            BASE=$(git rev-parse HEAD^1)
          fi
          python3 scripts/check-new-comments.py "$BASE" HEAD

  ci-report:
    name: ci-report
    if: always()
    needs: [changes, pick-macos, rust, rust-tests, server, server-deploy, net-integration, driver-integration, cli-integration, ffi-integration, spec, macos-app, runner-hook, installer, comments]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any CI job failed or was cancelled
        env:
          CHANGES: ${{ needs.changes.result }}
          PICK_MACOS: ${{ needs.pick-macos.result }}
          SITE_ONLY: ${{ needs.changes.outputs.site_only }}
          RUST: ${{ needs.rust.result }}
          RUST_TESTS: ${{ needs.rust-tests.result }}
          SERVER: ${{ needs.server.result }}
          SERVER_DEPLOY: ${{ needs.server-deploy.result }}
          NET_INTEGRATION: ${{ needs.net-integration.result }}
          DRIVER_INTEGRATION: ${{ needs.driver-integration.result }}
          CLI_INTEGRATION: ${{ needs.cli-integration.result }}
          FFI_INTEGRATION: ${{ needs.ffi-integration.result }}
          SPEC: ${{ needs.spec.result }}
          MACOS_APP: ${{ needs.macos-app.result }}
          RUNNER_HOOK: ${{ needs.runner-hook.result }}
          INSTALLER: ${{ needs.installer.result }}
          COMMENTS: ${{ needs.comments.result }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "site-only change: ${SITE_ONLY:-unknown}. Build and test jobs that skip for a site-only change report skipped."
          echo "changes: $CHANGES, pick-macos: $PICK_MACOS, rust: $RUST, rust-tests: $RUST_TESTS, server: $SERVER, server-deploy: $SERVER_DEPLOY, net-integration: $NET_INTEGRATION, driver-integration: $DRIVER_INTEGRATION, cli-integration: $CLI_INTEGRATION, ffi-integration: $FFI_INTEGRATION, spec: $SPEC, macos-app: $MACOS_APP, runner-hook: $RUNNER_HOOK, installer: $INSTALLER, comments: $COMMENTS"
          if [ "$FAILED" = "true" ]; then
            echo "::error::At least one CI job failed or was cancelled (changes: $CHANGES, pick-macos: $PICK_MACOS, rust: $RUST, rust-tests: $RUST_TESTS, server: $SERVER, server-deploy: $SERVER_DEPLOY, net-integration: $NET_INTEGRATION, driver-integration: $DRIVER_INTEGRATION, cli-integration: $CLI_INTEGRATION, ffi-integration: $FFI_INTEGRATION, spec: $SPEC, macos-app: $MACOS_APP, runner-hook: $RUNNER_HOOK, installer: $INSTALLER, comments: $COMMENTS). Open that job's log for the cause."
            exit 1
          fi
      - name: Fail unless the build and test jobs ran for a change outside site/
        if: needs.changes.outputs.site_only != 'true'
        env:
          RESULTS: rust=${{ needs.rust.result }} rust-tests=${{ needs.rust-tests.result }} server=${{ needs.server.result }} server-deploy=${{ needs.server-deploy.result }} net-integration=${{ needs.net-integration.result }} driver-integration=${{ needs.driver-integration.result }} cli-integration=${{ needs.cli-integration.result }} ffi-integration=${{ needs.ffi-integration.result }} spec=${{ needs.spec.result }} runner-hook=${{ needs.changes.outputs.runner_hook == 'true' && needs.runner-hook.result || 'not-needed' }} installer=${{ needs.installer.result }}
        run: |
          echo "Build and test jobs for a change outside site/: $RESULTS"
          for r in $RESULTS; do
            if [ "${r#*=}" != success ] && [ "${r#*=}" != not-needed ]; then
              echo "::error::A change outside site/ must run and pass every build and test job, but ${r%%=*} is ${r#*=}. Only a change whose files are all under site/ may skip them."
              exit 1
            fi
          done
      - name: Fail unless every macOS job ran on this push or passed in the merge queue on the same commit
        if: github.event_name == 'push'
        env:
          WANTED: rust=${{ needs.changes.outputs.rust_macos }} server=${{ needs.changes.outputs.server_macos }} spec=${{ needs.changes.outputs.spec_macos }} macos-app=${{ needs.changes.outputs.macos_app }} runner-hook=${{ needs.changes.outputs.runner_hook }}
          MACOS_APP: ${{ needs.macos-app.result }}
        run: |
          echo "macOS jobs on this push (true runs here, covered passed in the merge queue on this commit): $WANTED, macos app result $MACOS_APP"
          for w in $WANTED; do
            if [ "${w#*=}" != true ] && [ "${w#*=}" != covered ]; then
              echo "::error::A push to main must run every macOS job that no merge queue run passed on the same commit, but ${w%%=*} is ${w#*=}. The changes job log says why."
              exit 1
            fi
          done
          if [ "${WANTED#*macos-app=true}" != "$WANTED" ] && [ "$MACOS_APP" != success ]; then
            echo "::error::macos app had to run on this push, but its result is $MACOS_APP."
            exit 1
          fi
