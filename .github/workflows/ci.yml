        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: ./.github/actions/pnpm-store
      - run: pnpm install --frozen-lockfile
        working-directory: server
      - name: Test the app's session against the Worker under wrangler dev
        run: core/ffi/scripts/integration-test.sh

  spec:
    name: spec (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.site_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.spec_macos == 'true' && '["ubuntu-latest","macos"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os == 'macos' && 'macos-15' || matrix.os }}
    defaults:
      run:
        working-directory: spec
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          version: 1.75.0
          setup_only: true
      - run: buf lint
      - name: Check generated code is up to date
        run: |
          buf generate
          if ! git diff --exit-code -- ../server/src/gen ../core/proto/src/gen || [ -n "$(git status --porcelain -- ../server/src/gen ../core/proto/src/gen)" ]; then
            echo "::error::Generated code in server/src/gen or core/proto/src/gen is out of date. Run 'buf generate' in spec/ and commit the result."
            git status --short -- ../server/src/gen ../core/proto/src/gen
            exit 1
          fi
      - name: Check for breaking changes against the base
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.merge_group.base_sha || 'refs/heads/main' }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            BASE=$(git rev-parse HEAD^1)
            git update-ref refs/remotes/origin/breaking-base "$BASE"
          else
            git fetch --no-tags --depth=1 origin "+$BASE:refs/remotes/origin/breaking-base"
          fi
          if ! buf breaking --against "../.git#ref=refs/remotes/origin/breaking-base,subdir=spec"; then
            echo "::error::The schema in spec/proto breaks compatibility with the base $BASE (see the buf output above). Keep field numbers, names and types stable; reserve removed fields instead of deleting them."
            exit 1
          fi

  macos-app:
    name: macos app
    needs: [changes]
    if: needs.changes.outputs.macos_app == 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test notarize.sh against a stub notarytool
        run: scripts/test-notarize.sh
      - name: Test release verification rejects missing tickets and unnotarized artifacts
        run: nice -n 10 bash scripts/test-verify-release.sh
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Show Xcode and Swift versions
        run: xcodebuild -version && swift --version
      - name: Build the Rust core, the Swift bindings and the app (unsigned)
        run: scripts/build-release.sh
      - name: Test the Swift bindings
        run: swift test --package-path KoidriveFFI
      - name: Test the Swift bindings in the release configuration, which has no DEBUG condition
        run: swift test --package-path KoidriveFFI -c release
      - name: Test run-ui-tests.sh against a stub xcodebuild
        run: scripts/test-run-ui-tests.sh
      - name: Run the UI tests against the fake core
        timeout-minutes: 15
        run: scripts/run-ui-tests.sh build/UITests.xcresult
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: Koidrive-uitests
          path: apps/macos/build/UITests.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Check that the string catalog lists every string the app uses
        run: python3 scripts/check-string-catalog.py Koidrive/Localizable.xcstrings build/DerivedData
      - name: Check the app bundle
        run: plutil -p build/release/Koidrive.app/Contents/Info.plist
      - name: Sign the app ad hoc (pull requests are never signed with the Developer ID)
        run: scripts/sign-app.sh build/release/Koidrive.app -
      - name: Test login-item lifecycle commands without starting the UI
        run: nice -n 10 bash scripts/test-login-item-lifecycle.sh build/release/Koidrive.app
      - name: Package the disk image
        run: scripts/make-dmg.sh build/release/Koidrive.app build/release/Koidrive-unsigned.dmg
      - name: Verify the disk image
        run: |
          scripts/verify-release.sh build/release/Koidrive-unsigned.dmg unsigned
          echo "Unsigned build: pull requests and the merge queue never sign or notarize. SHA-256 $(shasum -a 256 build/release/Koidrive-unsigned.dmg | cut -d ' ' -f 1)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Koidrive-unsigned
          path: apps/macos/build/release/Koidrive-unsigned.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  installer:
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install shell test tools on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck zsh fish
      - name: Install shell test tools on macOS
        if: runner.os == 'macOS'
        run: brew install shellcheck fish
      - name: Check installer syntax and lint
        run: |
          nice -n 10 sh -n install.sh
          nice -n 10 sh -n scripts/test-install.sh
          nice -n 10 shellcheck -s sh install.sh scripts/test-install.sh
      - name: Test isolated installer journeys
        run: nice -n 10 python3 scripts/test-install-journey.py -v

  comments:
    name: comments
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Test the new-comment check
        run: python3 scripts/test-check-new-comments.py -v
      - name: Test the design-document splitter
        run: python3 scripts/test-split-sync-design.py -v
      - name: Test the property battery workflows, its triage and the known-failure registry
        run: python3 scripts/test-property-battery.py -v
      - name: Test the test-value harness
        run: python3 scripts/test-test-value.py -v
      - name: Fail on comments that this change adds
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ "$EVENT" = merge_group ]; then
            git fetch --no-tags --depth=1 origin "$BASE"
          else
            BASE=$(git rev-parse HEAD^1)
          fi
          python3 scripts/check-new-comments.py "$BASE" HEAD

  test-lines:
    name: test lines
    needs: changes
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: scripts/fn-docs
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the Rust parser the counter uses
        id: parser
        continue-on-error: true
        run: |
          cargo build --release --locked --manifest-path scripts/fn-docs/Cargo.toml
          echo "FN_DOCS=$PWD/scripts/fn-docs/target/release/fn-docs" >> "$GITHUB_ENV"
      - name: Test the test-line counter
        if: needs.changes.outputs.test_lines == 'true'
        run: python3 scripts/test-check-test-lines.py -v
      - name: Say the test-line report is unavailable
        if: steps.parser.outcome == 'failure'
        run: |
          echo "::warning title=Test-line budget::The Rust parser did not build, so this run has no test-line report."
          echo "The test-line report is unavailable because the Rust parser did not build." >> "$GITHUB_STEP_SUMMARY"
      - name: Report the test lines this change adds
        if: steps.parser.outcome == 'success'
        continue-on-error: true
        env:
          PR: ${{ github.event.pull_request.number }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          if [ -n "$QUEUE_REF" ]; then
            PR="$(sed -nE 's#^.*/pr-([0-9]+)-[0-9a-f]+$#\1#p' <<<"$QUEUE_REF")"
          fi
          python3 scripts/check-test-lines.py ${PR:+--pr "$PR"} HEAD^1 HEAD

  test-split-mapping:
    name: test split mapping
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: scripts/test-split
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Fetch the base this change is compared with
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.merge_group.base_sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = merge_group ]; then
            git fetch --no-tags --depth=1 origin "$BASE"
          elif [ "$EVENT" = push ]; then
            BASE="$BEFORE"
            git fetch --no-tags --depth=1 origin "$BASE"
          else
            BASE=$(git rev-parse HEAD^1)
          fi
          echo "BASE=$BASE" >> "$GITHUB_ENV"
      - name: Fail when a test split this change makes moves an item unchanged nowhere, or mapping.json misses one
        run: python3 scripts/split-tests.py verify --source-ref "$BASE"
      - name: Fail when a changed include! fragment is not rustfmt-formatted
        run: python3 scripts/split-tests.py check-format --base-ref "$BASE"

  store-upgrade:
    if: github.event_name != 'push'
    name: Store upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: ${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test the guard
        run: python3 scripts/test-check-store-upgrades.py
      - name: Check and run upgrade cases
        env:
          EVENT: ${{ github.event_name }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ "$EVENT" = merge_group ]; then
            BASE="$MERGE_BASE"
          else
            BASE="$(git rev-parse HEAD^1)"
          fi
          python3 scripts/check-store-upgrades.py "$BASE" HEAD

  state-io:
    if: github.event_name != 'push'
    name: state file safety (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Install the repository toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: state-io-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Prove the lints reject the unsafe writers and borrowed locks
        run: nice -n 10 python3 scripts/test-state-io.py -v
      - name: Reject new raw state-file writes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ "$EVENT" = merge_group ]; then
            git fetch --no-tags --depth=1 origin "$BASE"
          else
            BASE=$(git rev-parse HEAD^1)
          fi
          nice -n 10 python3 scripts/check-state-io.py "$BASE"


  ci-report:
    name: ci-report
    if: always()
    needs: [changes, rust-lint, rust-build-linux, rust-build-macos, rust-tests-linux, rust-tests-macos, rust-special-linux, rust-special-macos, rust-sim, rust-report, server, server-deploy, net-integration, driver-integration, cli-integration, ffi-integration, spec, macos-app, installer, comments, test-split-mapping, store-upgrade, state-io, test-lines]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any CI job failed or was cancelled
        env:
          CHANGES: ${{ needs.changes.result }}
          SITE_ONLY: ${{ needs.changes.outputs.site_only }}
          RUST_LINT: ${{ needs.rust-lint.result }}
          RUST_BUILD: ${{ needs.rust-build-linux.result }}/${{ needs.rust-build-macos.result }}
          RUST_TESTS: ${{ needs.rust-tests-linux.result }}/${{ needs.rust-tests-macos.result }}
          RUST_SPECIAL: ${{ needs.rust-special-linux.result }}/${{ needs.rust-special-macos.result }}
          RUST_SIM: ${{ needs.rust-sim.result }}
          RUST_REPORT: ${{ needs.rust-report.result }}
          SERVER: ${{ needs.server.result }}
          SERVER_DEPLOY: ${{ needs.server-deploy.result }}
          NET_INTEGRATION: ${{ needs.net-integration.result }}
          DRIVER_INTEGRATION: ${{ needs.driver-integration.result }}
          CLI_INTEGRATION: ${{ needs.cli-integration.result }}
          FFI_INTEGRATION: ${{ needs.ffi-integration.result }}
          SPEC: ${{ needs.spec.result }}
          MACOS_APP: ${{ needs.macos-app.result }}
          INSTALLER: ${{ needs.installer.result }}
          COMMENTS: ${{ needs.comments.result }}
          TEST_LINES: ${{ needs.test-lines.result }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "site-only change: ${SITE_ONLY:-unknown}. Build and test jobs that skip for a site-only change report skipped."
          echo "changes: $CHANGES, rust-lint: $RUST_LINT, rust-build: $RUST_BUILD, rust-tests: $RUST_TESTS, rust-special: $RUST_SPECIAL, rust-sim: $RUST_SIM, rust-report: $RUST_REPORT, server: $SERVER, server-deploy: $SERVER_DEPLOY, net-integration: $NET_INTEGRATION, driver-integration: $DRIVER_INTEGRATION, cli-integration: $CLI_INTEGRATION, ffi-integration: $FFI_INTEGRATION, spec: $SPEC, macos-app: $MACOS_APP, installer: $INSTALLER, comments: $COMMENTS, test-lines: $TEST_LINES"
          if [ "$FAILED" = "true" ]; then
            echo "::error::At least one CI job failed or was cancelled (changes: $CHANGES, rust-lint: $RUST_LINT, rust-build: $RUST_BUILD, rust-tests: $RUST_TESTS, rust-special: $RUST_SPECIAL, rust-sim: $RUST_SIM, rust-report: $RUST_REPORT, server: $SERVER, server-deploy: $SERVER_DEPLOY, net-integration: $NET_INTEGRATION, driver-integration: $DRIVER_INTEGRATION, cli-integration: $CLI_INTEGRATION, ffi-integration: $FFI_INTEGRATION, spec: $SPEC, macos-app: $MACOS_APP, installer: $INSTALLER, comments: $COMMENTS, test-lines: $TEST_LINES). Open that job's log for the cause."
            exit 1
          fi
      - name: Fail unless every build and test job the change selects ran
        if: needs.changes.outputs.site_only != 'true'
        env:
          RESULTS: rust-lint=${{ needs.changes.outputs.rust_lint == 'true' && needs.rust-lint.result || 'not-needed' }} rust-build=${{ needs.changes.outputs.rust_archive == 'true' && needs.rust-build-linux.result || 'not-needed' }} rust-tests=${{ needs.changes.outputs.rust_archive == 'true' && needs.rust-tests-linux.result || 'not-needed' }} rust-special=${{ needs.changes.outputs.rust_archive == 'true' && needs.rust-special-linux.result || 'not-needed' }} rust-build-macos=${{ needs.changes.outputs.rust_archive == 'true' && needs.changes.outputs.rust_macos == 'true' && needs.rust-build-macos.result || 'not-needed' }} rust-tests-macos=${{ needs.changes.outputs.rust_archive == 'true' && needs.changes.outputs.rust_macos == 'true' && needs.rust-tests-macos.result || 'not-needed' }} rust-special-macos=${{ needs.changes.outputs.rust_archive == 'true' && needs.changes.outputs.rust_macos == 'true' && needs.rust-special-macos.result || 'not-needed' }} rust-report=${{ needs.changes.outputs.rust_archive == 'true' && needs.rust-report.result || 'not-needed' }} rust-sim=${{ needs.changes.outputs.rust_sim == 'true' && needs.rust-sim.result || 'not-needed' }} server=${{ needs.changes.outputs.server == 'true' && needs.server.result || 'not-needed' }} server-deploy=${{ needs.changes.outputs.server_deploy == 'true' && needs.server-deploy.result || 'not-needed' }} net-integration=${{ needs.changes.outputs.net_integration == 'true' && needs.net-integration.result || 'not-needed' }} driver-integration=${{ needs.changes.outputs.driver_integration == 'true' && needs.driver-integration.result || 'not-needed' }} cli-integration=${{ needs.changes.outputs.cli_integration == 'true' && needs.cli-integration.result || 'not-needed' }} ffi-integration=${{ needs.changes.outputs.ffi_integration == 'true' && needs.ffi-integration.result || 'not-needed' }} spec=${{ needs.spec.result }} installer=${{ needs.installer.result }} test-lines=${{ github.event_name != 'push' && needs.test-lines.result || 'not-needed' }}
        run: |
          echo "Build and test jobs (not-needed: the change does not select it): $RESULTS"
          for r in $RESULTS; do
            if [ "${r#*=}" != success ] && [ "${r#*=}" != not-needed ]; then
              echo "::error::Every build and test job the change selects must run and pass, but ${r%%=*} is ${r#*=}. The changes job log says why the change selects it."
              exit 1
            fi
          done
      - name: Fail unless every macOS job ran on this push or a merge queue run passed CI on the same commit
        if: github.event_name == 'push'
        env:
          WANTED: rust=${{ needs.changes.outputs.rust_macos }} server=${{ needs.changes.outputs.server_macos }} spec=${{ needs.changes.outputs.spec_macos }} macos-app=${{ needs.changes.outputs.macos_app }}
          MACOS_APP: ${{ needs.macos-app.result }}
        run: |
          echo "macOS jobs on this push (true runs here, covered: a merge queue run passed CI on this commit): $WANTED, macos app result $MACOS_APP"
          for w in $WANTED; do
            if [ "${w#*=}" != true ] && [ "${w#*=}" != covered ]; then
              echo "::error::A push to main must run every macOS job unless a merge queue run passed CI on the same commit, but ${w%%=*} is ${w#*=}. The changes job log says why."
              exit 1
            fi
          done
          if [ "${WANTED#*macos-app=true}" != "$WANTED" ] && [ "$MACOS_APP" != success ]; then
            echo "::error::macos app had to run on this push, but its result is $MACOS_APP."
            exit 1
          fi
