# SPDX-License-Identifier: Apache-2.0

name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '23 16 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  KOIDRIVE_PROPTEST_DETERMINISTIC: ${{ github.event_name == 'merge_group' }}

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      rust_lint: ${{ steps.paths.outputs.rust_lint }}
      rust_driver: ${{ steps.paths.outputs.rust_driver }}
      rust_engine: ${{ steps.paths.outputs.rust_engine }}
      rust_sim: ${{ steps.paths.outputs.rust_sim }}
      rust_archive: ${{ steps.shards.outputs.rust_archive }}
      rust_shards_linux: ${{ steps.shards.outputs.rust_shards_linux }}
      rust_shards_macos: ${{ steps.shards.outputs.rust_shards_macos }}
      server: ${{ steps.paths.outputs.server }}
      server_deploy: ${{ steps.paths.outputs.server_deploy }}
      net_integration: ${{ steps.paths.outputs.net_integration }}
      driver_integration: ${{ steps.paths.outputs.driver_integration }}
      cli_integration: ${{ steps.paths.outputs.cli_integration }}
      ffi_integration: ${{ steps.paths.outputs.ffi_integration }}
      rust_macos: ${{ steps.paths.outputs.rust_macos }}
      server_macos: ${{ steps.paths.outputs.server_macos }}
      spec_macos: ${{ steps.paths.outputs.spec_macos }}
      macos_app: ${{ steps.paths.outputs.macos_app }}
      test_lines: ${{ steps.paths.outputs.test_lines }}
      site_only: ${{ steps.paths.outputs.site_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Test the CI workflow
        run: python3 scripts/test-ci-workflow.py -v
      - name: Test Rust partition coverage
        run: python3 scripts/test-ci-rust-partitions.py RustPartitions -v
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: scripts/ci-select
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the job selector
        id: selector
        continue-on-error: true
        run: cargo build --locked --manifest-path scripts/ci-select/Cargo.toml
      - name: Decide which jobs the change needs
        id: paths
        env:
          SELECTOR_BUILD: ${{ steps.selector.outcome }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.merge_group.base_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then
            echo "$EVENT run: every Linux and macOS job runs, so a run on main saves every Rust cache that pull requests and the merge queue restore."
            {
              echo "site_only=false"
              printf '%s=true\n' rust rust_lint rust_driver rust_engine rust_sim server server_deploy net_integration driver_integration cli_integration ffi_integration test_lines rust_macos server_macos spec_macos macos_app
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = push ]; then
            echo "Push to main: every Linux job runs."
            {
              echo "site_only=false"
              printf '%s=true\n' rust rust_lint rust_driver rust_engine rust_sim server server_deploy net_integration driver_integration cli_integration ffi_integration test_lines
            } >> "$GITHUB_OUTPUT"
            api() {
              curl -fsS --max-time 15 -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/$1"
            }
            macos=true
            if ! runs="$(api "workflows/ci.yml/runs?event=merge_group&head_sha=$GITHUB_SHA&status=success&per_page=1")" || ! run="$(jq -ec '.workflow_runs | if type == "array" then map(select(.head_sha == env.GITHUB_SHA and .event == "merge_group" and .conclusion == "success")) | .[0] // {} else error("no workflow_runs") end' <<<"$runs")"; then
              echo "::warning::Looking up the merge queue run of $GITHUB_SHA failed (see the error above), so every macOS job runs."
            elif [ "$run" = '{}' ]; then
              echo "No successful merge queue run of ci.yml tested $GITHUB_SHA, so every macOS job runs."
            else
              macos=covered
              echo "Merge queue run $(jq -r .html_url <<<"$run") passed CI on $GITHUB_SHA, so the macOS jobs it ran or did not need are skipped here."
              echo "Merge queue run $(jq -r .html_url <<<"$run") tested this commit, so its macOS jobs are skipped here." >> "$GITHUB_STEP_SUMMARY"
            fi
            printf "%s=$macos\n" rust_macos server_macos spec_macos macos_app >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = merge_group ]; then
            git fetch --no-tags --depth=1 origin "$BASE"
          else
            BASE=$(git rev-parse HEAD^1)
          fi
          if ! git diff -z --name-only --no-renames "$BASE" HEAD > "$RUNNER_TEMP/changed"; then
            echo "::error::git diff between $BASE and HEAD failed, so the changed paths are unknown."
            exit 1
          fi
          changed="$(tr '\0' '\n' < "$RUNNER_TEMP/changed")"
          echo "Files this $EVENT run changes against $BASE:"
          printf '%s\n' "$changed"
          if [ -n "$changed" ] && ! grep -qv '^site/' <<<"$changed"; then
            echo "site_only: true, because every changed file is under site/, so the build and test jobs skip."
            {
              printf '%s=false\n' rust_macos server_macos spec_macos macos_app rust rust_lint rust_driver rust_engine rust_sim server server_deploy net_integration driver_integration cli_integration ffi_integration test_lines
              echo "site_only=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "site_only: false, because a changed file is outside site/."
          echo "site_only=false" >> "$GITHUB_OUTPUT"
          echo "Jobs this change selects against $BASE (.github/ci-select.toml):"
          if [ "$SELECTOR_BUILD" != success ] || ! git worktree add --detach "$RUNNER_TEMP/base" "$BASE" || ! selection="$(scripts/ci-select/target/debug/ci-select .github/ci-select.toml "$RUNNER_TEMP/base" . "$RUNNER_TEMP/changed")"; then
            echo "::warning::The job selector failed to build or run (see the error above), so every job runs."
            selection="$(printf '%s=true\n' rust rust_lint rust_driver rust_engine rust_sim server server_deploy net_integration driver_integration cli_integration ffi_integration test_lines macos_app)"
          fi
          grep -v '^macos_app=' <<<"$selection" >> "$GITHUB_OUTPUT"
          app_selected=false
          if grep -Fxq macos_app=true <<<"$selection"; then app_selected=true; fi
          if [ "$EVENT" = merge_group ]; then
            echo "Merge queue run: every macOS leg of a selected job runs."
            {
              printf '%s=true\n' rust_macos server_macos spec_macos
              echo "macos_app=$app_selected"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash scripts/test-macos-changes.sh
          if ! macos="$(scripts/macos-changes.sh "$BASE" HEAD)"; then
            echo "::error::Listing the macOS-specific files between $BASE and HEAD failed (see the error above)."
            exit 1
          fi
          echo "Files this pull request changes that can build or behave differently on macOS:"
          printf '%s\n' "${macos:-none}"
          decide() {
            if [ -n "$(tr -d '[:space:]' <<<"$3")" ]; then
              echo "$1: runs, because of $(tr '\n' ' ' <<<"$3")"
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1: skipped, because $2. The merge queue runs it if the change selects it."
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          workflow="$(grep -E '^(\.github/workflows/ci\.yml$|scripts/(test-)?macos-changes\.sh$)' <<<"$changed" || true)"
          decide rust_macos "no macOS-specific Rust input changed" "$(cut -f1 <<<"$macos" | grep -v '^apps/macos/' || true)"$'\n'"$workflow"
          if [ "$app_selected" = true ]; then
            decide macos_app "neither the app nor a macOS-specific input of the core changed" "$(cut -f1 <<<"$macos" | grep -v '^cli/' || true)"$'\n'"$workflow"
          else
            echo "macos_app: skipped, because the change reaches neither the app nor the Rust packages it builds."
            echo "macos_app=false" >> "$GITHUB_OUTPUT"
          fi
          for job in server_macos spec_macos; do
            decide "$job" "ci.yml did not change" "$(grep -Fx '.github/workflows/ci.yml' <<<"$changed" || true)"
          done
      - name: Record the tests a coverage map would skip (shadow mode, every test still runs)
        if: steps.selector.outcome == 'success' && steps.paths.outputs.site_only != 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/coverage-map" "$RUNNER_TEMP/test-selection"
          if ! run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow coverage-map.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"; then
            echo "::warning::Looking up the newest coverage map failed (see the error above), so the shadow selection keeps every test."
            jq -n '{map: null, everything: "looking up the newest coverage map failed", changed: [], skipped: []}' > "$RUNNER_TEMP/test-selection/selection.json"
            exit 0
          fi
          if [ -n "$run" ]; then
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --pattern 'coverage-map-*' --dir "$RUNNER_TEMP/coverage-map"
          fi
          map="$(find "$RUNNER_TEMP/coverage-map" -name coverage-map.json | head -n 1)"
          env -u GITHUB_STEP_SUMMARY scripts/ci-select/target/debug/ci-select .github/ci-select.toml "$RUNNER_TEMP/base" . "$RUNNER_TEMP/changed" \
            --tests "${map:-$RUNNER_TEMP/coverage-map/none.json}" "$RUNNER_TEMP/test-selection/selection.json" > /dev/null
          jq -r '"Shadow test selection: " + (if .everything then "every test kept, because " + .everything else "\(.skipped | length) tests would be skipped against the coverage map of \(.map)" end) + "."' \
            "$RUNNER_TEMP/test-selection/selection.json"
      - if: steps.selector.outcome == 'success' && steps.paths.outputs.site_only != 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-test-selection
          path: ${{ runner.temp }}/test-selection
          if-no-files-found: ignore
          retention-days: 7
      - name: Plan the Rust test archive and its shards
        id: shards
        env:
          RUST: ${{ steps.paths.outputs.rust }}
          RUST_DRIVER: ${{ steps.paths.outputs.rust_driver }}
          RUST_ENGINE: ${{ steps.paths.outputs.rust_engine }}
        run: |
          archive=false
          if [ "$RUST" = true ] || [ "$RUST_DRIVER" = true ] || [ "$RUST_ENGINE" = true ]; then archive=true; fi
          linux="$(jq -cn '{include: [range(1; 6) | {os: "ubuntu-latest", shard: ., of: 5}]}')"
          macos="$(jq -cn '{include: [range(1; 7) | {os: "macos", shard: ., of: 6}]}')"
          echo "Rust test archive: $archive. Linux shards: $linux. macOS shards, when macOS runs: $macos"
          {
            echo "rust_archive=$archive"
            echo "rust_shards_linux=$linux"
            echo "rust_shards_macos=$macos"
          } >> "$GITHUB_OUTPUT"
      - name: Keep merged store migrations unchanged
        if: github.event_name != 'push'
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ "$EVENT" = merge_group ]; then
            git fetch --no-tags --depth=1 origin "$BASE"
          else
            BASE=$(git rev-parse HEAD^1)
          fi
          if ! changed="$(git diff --name-only --no-renames --diff-filter=DMT "$BASE" HEAD -- core/store/migrations)"; then
            echo "::error::git diff between $BASE and HEAD failed, so changes to merged store migrations are unknown."
            exit 1
          fi
          if [ -n "$changed" ]; then
            while read -r file; do
              echo "::error file=$file::$file is a merged store migration. Stores may have applied it already, so add a new migration instead of changing or removing this one."
            done <<<"$changed"
            exit 1
          fi
          if git cat-file -e "$BASE:core/store/migrations/legacy" 2>/dev/null; then
            if ! added="$(git diff --name-only --no-renames --diff-filter=A "$BASE" HEAD -- core/store/migrations/legacy)"; then
              echo "::error::git diff between $BASE and HEAD failed, so additions to the legacy store migrations are unknown."
              exit 1
            fi
            if [ -n "$added" ]; then
              while read -r file; do
                echo "::error file=$file::$file adds a legacy store migration. Legacy steps map positional schema versions, so add the migration as core/store/migrations/<name>.sql instead."
              done <<<"$added"
              exit 1
            fi
          fi
          echo "No merged store migration changed."

  rust-lint:
    name: rust lint (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.site_only != 'true' && needs.changes.outputs.rust_lint == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.rust_macos == 'true' && '["ubuntu-latest","macos"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os == 'macos' && 'macos-15' || matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: lint-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --locked --features koidrive-cli/test-install-inventory,koidrive-cli/test-setup -- -D warnings
      - name: Run the doctests, which nextest does not run
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: cargo test --doc --workspace --exclude koidrive-sim --locked --features koidrive-cli/test-install-inventory,koidrive-cli/test-setup
      - name: Verify Rust workspace feature parity
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: python3 scripts/test-ci-rust-partitions.py FeatureParity -v
      - name: Test the Rust test archive arguments, shard plans and report
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: python3 scripts/test-ci-rust-tests.py -v
      - name: Test the regression-case splitter
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: |
          python3 scripts/test-split-proptest-regressions.py -v
          LC_ALL=C PYTHONUTF8=0 PYTHONCOERCECLOCALE=0 python3 scripts/test-split-proptest-regressions.py -v
      - name: Require per-seed persistence for every property test
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/check-proptest-persistence-target
        run: |
          nice -n 10 cargo fmt --manifest-path scripts/check-proptest-persistence/Cargo.toml --check
          nice -n 10 cargo clippy --manifest-path scripts/check-proptest-persistence/Cargo.toml --all-targets --locked -- -D warnings
          nice -n 10 cargo test --manifest-path scripts/check-proptest-persistence/Cargo.toml --locked
          nice -n 10 cargo run --manifest-path scripts/check-proptest-persistence/Cargo.toml --locked --
      - name: Test the scenario splitter
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/test-split-target
        run: |
          nice -n 10 cargo fmt --manifest-path scripts/test-split/Cargo.toml --check
          nice -n 10 cargo clippy --manifest-path scripts/test-split/Cargo.toml --all-targets --locked -- -D warnings
          python3 scripts/test-split/test_split.py -v
      - name: Test the job selector
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/ci-select-target
        run: |
          nice -n 10 cargo fmt --manifest-path scripts/ci-select/Cargo.toml --check
          nice -n 10 cargo clippy --manifest-path scripts/ci-select/Cargo.toml --all-targets --locked -- -D warnings
          nice -n 10 cargo test --manifest-path scripts/ci-select/Cargo.toml --locked

  rust-build-linux:
    name: rust build (ubuntu-latest)
    needs: [changes]
    if: needs.changes.outputs.site_only != 'true' && needs.changes.outputs.rust_archive == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OS: ubuntu-latest
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps: &rust-build-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest@0.9.152
      - name: Build every selected test binary into one archive
        env:
          SELECTED: rust=${{ needs.changes.outputs.rust }} rust_driver=${{ needs.changes.outputs.rust_driver }} rust_engine=${{ needs.changes.outputs.rust_engine }}
        run: |
          out="$RUNNER_TEMP/rust-tests"
          mkdir -p "$out" "$RUNNER_TEMP/test-inventory"
          selected=()
          for pair in $SELECTED; do
            if [ "${pair#*=}" = true ]; then selected+=("${pair%%=*}"); fi
          done
          args=()
          lines="$(python3 scripts/ci-rust-tests.py archive-args "${selected[@]}")"
          while IFS= read -r arg; do args+=("$arg"); done <<<"$lines"
          set -- "${args[@]}"
          echo "Partitions: ${selected[*]}. Archive arguments: $*"
          cargo nextest archive --locked "$@" --archive-file "$out/archive.tar.zst" --cargo-message-format json-render-diagnostics > "$RUNNER_TEMP/build.json"
          cargo test --locked -p koidrive-test-support --lib --no-run --message-format=json-render-diagnostics > "$RUNNER_TEMP/probe.json"
          scripts/require-runtime-checks.sh "$RUNNER_TEMP/build.json" "$RUNNER_TEMP/probe.json"
          cargo nextest list --locked "$@" --message-format json > "$RUNNER_TEMP/test-inventory/list.json"
          jq -r '."rust-suites"[] | .["binary-id"] as $b | .testcases | to_entries[] | "\($b) \(.key)"' "$RUNNER_TEMP/test-inventory/list.json" > "$RUNNER_TEMP/test-inventory/inventory.txt"
          echo "$(wc -l < "$RUNNER_TEMP/test-inventory/inventory.txt" | tr -d ' ') tests in the archive, $(du -h "$out/archive.tar.zst" | cut -f1) compressed."
      - name: Balance the shards by measured test time
        env:
          SHARDS: ${{ env.OS == 'macos' && needs.changes.outputs.rust_shards_macos || needs.changes.outputs.rust_shards_linux }}
        run: |
          set -o pipefail
          python3 scripts/ci-rust-tests.py plan --os "$OS" --shards "$(jq --arg os "$OS" '[.include[] | select(.os == $os)] | length' <<<"$SHARDS")" \
            --list "$RUNNER_TEMP/test-inventory/list.json" --out "$RUNNER_TEMP/rust-tests/shards.toml" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-test-inventory-${{ env.OS }}
          path: ${{ runner.temp }}/test-inventory
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-tests-${{ env.OS }}
          path: ${{ runner.temp }}/rust-tests
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  rust-build-macos:
    name: rust build (macos)
    needs: [changes]
    if: needs.changes.outputs.site_only != 'true' && needs.changes.outputs.rust_archive == 'true' && needs.changes.outputs.rust_macos == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      OS: macos
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps: *rust-build-steps

  rust-tests-linux:
    name: rust tests (ubuntu-latest, ${{ matrix.shard }}/${{ matrix.of }})
    needs: [changes, rust-build-linux]
    if: needs.changes.outputs.site_only != 'true' && needs.changes.outputs.rust_archive == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.rust_shards_linux) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OS: ubuntu-latest
    steps: &rust-tests-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest@0.9.152
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-tests-${{ env.OS }}
          path: ${{ runner.temp }}/rust-tests
      - name: Run this shard's tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          cargo nextest run --archive-file "$RUNNER_TEMP/rust-tests/archive.tar.zst" --extract-to "$GITHUB_WORKSPACE" --extract-overwrite \
            --config-file "$RUNNER_TEMP/rust-tests/shards.toml" --profile "shard-$SHARD" --no-tests=pass
      - name: Put this shard's results in a folder named after it
        if: ${{ !cancelled() }}
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p "$RUNNER_TEMP/junit/rust-junit-$OS-$SHARD"
          cp "target/nextest/shard-$SHARD/junit.xml" "$RUNNER_TEMP/junit/rust-junit-$OS-$SHARD/"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-junit-${{ env.OS }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/junit
          if-no-files-found: error
          retention-days: 7

  rust-tests-macos:
    name: rust tests (macos, ${{ matrix.shard }}/${{ matrix.of }})
    needs: [changes, rust-build-macos]
    if: needs.changes.outputs.site_only != 'true' && needs.changes.outputs.rust_archive == 'true' && needs.changes.outputs.rust_macos == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.rust_shards_macos) }}
    runs-on: macos-15
    timeout-minutes: 30
    env:
      OS: macos
    steps: *rust-tests-steps

  rust-special-linux:
    name: rust special (ubuntu-latest)
    needs: [changes, rust-build-linux]
    if: needs.changes.outputs.site_only != 'true' && needs.changes.outputs.rust_archive == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OS: ubuntu-latest
    steps: &rust-special-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: special-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest@0.9.152
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-tests-${{ env.OS }}
          path: ${{ runner.temp }}/rust-tests
      - name: Replay saved property regressions without random cases
        env:
          PROPTEST_CASES: '0'
          FILTERS: >-
            ${{ needs.changes.outputs.rust == 'true' && 'binary_id(=koidrive-chunk::chunking) | binary_id(=koidrive-ignore::properties) | binary_id(=koidrive-ignore::git_oracle) | binary_id(=koidrive-net) |' || '' }}
            ${{ needs.changes.outputs.rust_engine == 'true' && 'binary_id(=koidrive-engine::names) | binary_id(=koidrive-engine::trees) | binary_id(=koidrive-engine::effects) |' || '' }}
            ${{ needs.changes.outputs.rust_driver == 'true' && '(binary_id(=koidrive-driver) & test(batches_leave_l_a_tree_that_holds_the_disk)) |' || '' }}
        run: cargo nextest run --archive-file "$RUNNER_TEMP/rust-tests/archive.tar.zst" --extract-to "$GITHUB_WORKSPACE" --extract-overwrite --profile ci --success-output final -E "$(sed -E 's/[ |]+$//' <<<"$FILTERS")"
      - name: Test root identities on btrfs and ext4
        if: ${{ !cancelled() && runner.os == 'Linux' && needs.changes.outputs.rust == 'true' }}
        run: |
          if ! command -v mkfs.btrfs > /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq btrfs-progs
          fi
          image="$RUNNER_TEMP/btrfs.img"
          truncate -s 256M "$image"
          mkfs.btrfs -q "$image"
          sudo mkdir -p /mnt/koidrive-btrfs
          sudo mount -o loop,user_subvol_rm_allowed "$image" /mnt/koidrive-btrfs
          sudo chown "$USER" /mnt/koidrive-btrfs
          KOIDRIVE_TEST_BTRFS_DIR=/mnt/koidrive-btrfs cargo nextest run --archive-file "$RUNNER_TEMP/rust-tests/archive.tar.zst" --extract-to "$GITHUB_WORKSPACE" --extract-overwrite --profile ci --success-output final -E 'binary_id(=koidrive-fs::root) & test(a_btrfs_snapshot)'
          KOIDRIVE_TEST_LOOP_MOUNTS=1 cargo nextest run --archive-file "$RUNNER_TEMP/rust-tests/archive.tar.zst" --extract-to "$GITHUB_WORKSPACE" --extract-overwrite --profile ci --success-output final -E 'binary_id(=koidrive-fs::root) & test(an_ext4_disk)'
      - name: Test volumes and disks mounted inside a folder
        if: ${{ !cancelled() && runner.os == 'Linux' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.rust_driver == 'true') }}
        env:
          KOIDRIVE_TEST_MOUNTS: '1'
          TERMS: >-
            ${{ needs.changes.outputs.rust == 'true' && 'koidrive-fs::volumes koidrive-test-support=disks' || '' }}
            ${{ needs.changes.outputs.rust_driver == 'true' && 'koidrive-driver=disk_ejected koidrive-driver=another_disk_mounted koidrive-driver=two_copies_of_one_disk koidrive-driver=mounted_over_synced koidrive-driver=disk_without_a_uuid koidrive-driver=before_an_upgrade' || '' }}
        run: |
          if ! command -v mkfs.vfat > /dev/null || ! command -v mkfs.exfat > /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq dosfstools exfatprogs
          fi
          read -ra terms <<<"$TERMS"
          cargo nextest run --archive-file "$RUNNER_TEMP/rust-tests/archive.tar.zst" --extract-to "$GITHUB_WORKSPACE" --extract-overwrite --profile ci --success-output final \
            -E "$(python3 scripts/ci-rust-tests.py filter "${terms[@]}")"
          python3 scripts/ci-rust-tests.py matched --junit target/nextest/ci/junit.xml "${terms[@]}"
      - name: Test that the app installer refuses an app signed by a forged Developer ID
        if: ${{ !cancelled() && env.OS == 'macos' && needs.changes.outputs.rust_driver == 'true' }}
        run: |
          set -o pipefail
          security list-keychains -d user
          cargo test --locked -p koidrive-cli --bin koi --features koidrive-cli/test-install-inventory -- --ignored --exact app_install::macos::tests::verification::native_codesign_refuses_an_app_and_updater_signed_by_a_forged_developer_id 2>&1 | tee "$RUNNER_TEMP/forged-developer-id.log"
          security list-keychains -d user
          if ! grep -q '^test result: ok. 1 passed;' "$RUNNER_TEMP/forged-developer-id.log"; then
            echo "::error::The forged Developer ID test filter must run exactly one test. The test was renamed or moved, so update the filter."
            exit 1
          fi
      - name: Test release updates with a tag-derived version
        if: ${{ !cancelled() && needs.changes.outputs.rust_driver == 'true' }}
        run: |
          python3 scripts/stamp-release-version.py v0.1.0-alpha.1
          nice -n 10 cargo test --locked -p koidrive-cli --test update --features koidrive-cli/test-install-inventory

  rust-special-macos:
    name: rust special (macos)
    needs: [changes, rust-build-macos]
    if: needs.changes.outputs.site_only != 'true' && needs.changes.outputs.rust_archive == 'true' && needs.changes.outputs.rust_macos == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      OS: macos
    steps: *rust-special-steps

  rust-sim:
    name: rust tests (${{ matrix.os }}, sim)
    needs: [changes]
    if: needs.changes.outputs.site_only != 'true' && needs.changes.outputs.rust_sim == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.rust_macos == 'true' && '["ubuntu-latest","macos"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os == 'macos' && 'macos-15' || matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: sim-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: List the package test inventory
        run: |
          cargo test --locked --profile checked --no-fail-fast -p koidrive-sim --features koidrive-engine/serde --no-run --message-format=json-render-diagnostics > "$RUNNER_TEMP/build.json"
          cargo test --locked --profile checked -p koidrive-test-support --lib --no-run --message-format=json-render-diagnostics > "$RUNNER_TEMP/probe.json"
          scripts/require-runtime-checks.sh "$RUNNER_TEMP/build.json" "$RUNNER_TEMP/probe.json"
          cargo test --locked --profile checked --no-fail-fast -p koidrive-sim --features koidrive-engine/serde -- --list --format terse > "$RUNNER_TEMP/inventory.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-test-inventory-${{ matrix.os }}-sim
          path: ${{ runner.temp }}/inventory.txt
          if-no-files-found: error
          retention-days: 7
      - name: Run the package tests and doctests
        run: cargo test --locked --profile checked --no-fail-fast -p koidrive-sim --features koidrive-engine/serde

  rust-report:
    name: rust test report
    needs: [changes, rust-build-linux, rust-build-macos, rust-tests-linux, rust-tests-macos]
    if: ${{ !cancelled() && needs.changes.outputs.site_only != 'true' && needs.changes.outputs.rust_archive == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: junit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: rust-junit-*
          path: ${{ runner.temp }}/junit
          merge-multiple: true
      - id: inventory_linux
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: rust-test-inventory-ubuntu-latest
          path: ${{ runner.temp }}/inventory/rust-test-inventory-ubuntu-latest
      - id: selection
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: rust-test-selection
          path: ${{ runner.temp }}/test-selection
      - id: inventory_macos
        if: needs.changes.outputs.rust_macos == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: rust-test-inventory-macos
          path: ${{ runner.temp }}/inventory/rust-test-inventory-macos
      - name: Check that the shards ran every test once, and report timings and flaky tests
        env:
          RUST_MACOS: ${{ needs.changes.outputs.rust_macos }}
          JUNIT_DOWNLOAD: ${{ steps.junit.outcome }}
          INVENTORY_LINUX: ${{ steps.inventory_linux.outcome }}
          INVENTORY_MACOS: ${{ steps.inventory_macos.outcome }}
        run: |
          status=0
          if [ "$JUNIT_DOWNLOAD" != success ]; then
            echo "::error::Downloading the shard results failed (see that step), so tests in the results it missed count as not run."
            status=1
          fi
          oses=ubuntu-latest
          if [ "$RUST_MACOS" = true ]; then oses="$oses macos"; fi
          for os in $oses; do
            downloaded=$INVENTORY_LINUX
            if [ "$os" = macos ]; then downloaded=$INVENTORY_MACOS; fi
            if [ "$downloaded" != success ]; then
              echo "::error::The test inventory of rust build ($os) did not download ($downloaded), so its shards cannot be checked."
              status=1
              continue
            fi
            mkdir -p "$RUNNER_TEMP/by-os/$os"
            mv "$RUNNER_TEMP/junit/rust-junit-$os-"* "$RUNNER_TEMP/by-os/$os/" || true
            python3 scripts/ci-rust-tests.py report --os "$os" --list "$RUNNER_TEMP/inventory/rust-test-inventory-$os/list.json" \
              --junit "$RUNNER_TEMP/by-os/$os" --out "$RUNNER_TEMP/report/$os" || status=1
            cat "$RUNNER_TEMP/report/$os/summary.md" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$status" = 0 ]; then echo "RUST_RESULTS_COMPLETE=true" >> "$GITHUB_ENV"; fi
          exit "$status"
      - name: Count the failed tests the shadow test selection would have skipped
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          complete=()
          if [ "$RUST_RESULTS_COMPLETE" = true ]; then complete=(--complete); fi
          python3 scripts/ci-rust-tests.py shadow --selection "$RUNNER_TEMP/test-selection/selection.json" "${complete[@]}" \
            --junit "$RUNNER_TEMP/junit" --junit "$RUNNER_TEMP/by-os" --out "$RUNNER_TEMP/report/shadow-selection.json" >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-test-report
          path: ${{ runner.temp }}/report
          if-no-files-found: error
          retention-days: 30

  server:
    name: server (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.site_only != 'true' && needs.changes.outputs.server == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.server_macos == 'true' && '["ubuntu-latest","macos"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os == 'macos' && 'macos-15' || matrix.os }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: server/package.json
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: ./.github/actions/pnpm-store
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test --reporter=verbose
      - name: Test the deploy-test scripts without a deployment
        run: pnpm exec vitest run --config scripts/deploy-test/vitest.config.ts --reporter=verbose run.unit e2e.unit load.unit bench.unit first-sync.unit

  server-deploy:
    name: server deploy check
    needs: changes
    if: needs.changes.outputs.site_only != 'true' && needs.changes.outputs.server_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: ./.github/actions/pnpm-store
      - name: Check Worker launchers and deploy startup without a deployment
        run: |
          nice -n 10 python3 scripts/test-worker-launchers.py -v
          nice -n 10 python3 scripts/test-check-deploy.py -v
          nice -n 10 python3 scripts/test-stress-test-servers.py -v
      - name: Check the committed standalone release version before generating it
        run: node --test server/scripts/check-release-version.mjs
      - name: Keep KOIDRIVE_FEATURES out of the tracked Worker config
        run: |
          if grep -n KOIDRIVE_FEATURES server/wrangler.jsonc; then
            echo "::error file=server/wrangler.jsonc::KOIDRIVE_FEATURES is for test deployments, which pass it at deploy time. Every new deployment copies server/wrangler.jsonc, so it must not set it (RFC 0022 §3 rule 7)."
            exit 1
          fi
      - name: Deploy a copy of server/ on its own (dry run, then wrangler dev and a claim)
        run: node server/scripts/check-deploy.mjs
      - name: Install server dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile
      - name: Pack the server bundle that the CLI embeds
        run: node server/scripts/pack-bundle.mjs "$RUNNER_TEMP/server-bundle"
      - name: Check that the packer replaces nothing in its output
        run: node --test server/scripts/check-pack-bundle.mjs

  net-integration:
    name: net integration (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.site_only != 'true' && needs.changes.outputs.net_integration == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
