  cli-integration:
    name: cli integration (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.site_only != 'true' && needs.changes.outputs.cli_integration == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: ./.github/actions/pnpm-store
      - run: pnpm install --frozen-lockfile
        working-directory: server
      - name: Start a systemd user instance for the runner user
        run: |
          sudo loginctl enable-linger "$USER"
          runtime="/run/user/$(id -u)"
          for _ in $(seq 1 100); do
            if [ -S "$runtime/systemd/private" ]; then break; fi
            sleep 0.2
          done
          XDG_RUNTIME_DIR="$runtime" systemctl --user show-environment > /dev/null
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          echo "KOIDRIVE_TEST_SYSTEMD=1" >> "$GITHUB_ENV"
      - name: Test the koi command and daemon against the Worker under wrangler dev
        run: cli/scripts/integration-test.sh

