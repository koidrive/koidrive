# SPDX-License-Identifier: Apache-2.0

name: Test value

run-name: Test value of the ${{ inputs.sample }} sample on ${{ inputs.ref || github.ref_name }} (${{ inputs.shards }} shards)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to measure (empty measures the ref the run starts from)
        type: string
        default: ''
      sample:
        description: Tests and the code they mutate, as defined in scripts/test-value.py
        type: choice
        options: [driver, guard, commit]
        required: true
      shards:
        description: Number of mutant shards, 1 to 40; at most 10 run at once
        type: string
        default: '8'
      slow:
        description: Baseline seconds from which a test runs only on the mutants the faster tests miss
        type: string
        default: '10'

permissions: {}

env:
  CARGO_TERM_COLOR: never
  SAMPLE: ${{ inputs.sample }}
  SLOW: ${{ inputs.slow || '10' }}
  OUT: ${{ github.workspace }}/test-value-out

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
      shards: ${{ steps.pin.outputs.shards }}
    steps:
      - name: Check the inputs
        env:
          REF: ${{ inputs.ref }}
          SHARDS: ${{ inputs.shards }}
        run: |
          errors=()
          [[ "$REF" != -* ]] || errors+=("ref must be a branch, tag or commit, not an option: '$REF'.")
          [[ "$SHARDS" =~ ^([1-9]|[1-3][0-9]|40)$ ]] || errors+=("shards must be a whole number from 1 to 40, got '$SHARDS'.")
          [[ "$SLOW" =~ ^[0-9]{1,4}(\.[0-9]+)?$ ]] || errors+=("slow must be a number of seconds, got '$SLOW'.")
          for error in "${errors[@]}"; do echo "::error::$error"; done
          [ "${#errors[@]}" -eq 0 ]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Pin the commit and the shards
        id: pin
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "shards=$(seq 0 $((SHARDS - 1)) | jq -cs .)" >> "$GITHUB_OUTPUT"
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test-value-${{ inputs.sample }}
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.152
          fallback: none
      - name: List the mutants
        run: |
          mkdir -p "$OUT"
          python3 scripts/test-value.py plan --sample "$SAMPLE" --out "$OUT/mutants.json"
      - name: Run the tests three times without mutations
        run: python3 scripts/test-value.py baseline --sample "$SAMPLE" --out "$OUT/baseline.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-value-plan
          path: ${{ env.OUT }}
          retention-days: 30
          if-no-files-found: error

  mutants:
    name: mutants (${{ matrix.shard }})
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    env:
      SHARD: ${{ matrix.shard }}/${{ inputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test-value-${{ inputs.sample }}
          save-if: false
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519
        with:
          tool: cargo-nextest@0.9.152
          fallback: none
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-value-plan
          path: ${{ env.OUT }}
      - name: Run every mutant of the shard against the sample's tests
        run: |
          python3 scripts/test-value.py run --sample "$SAMPLE" --mutants "$OUT/mutants.json" \
            --baseline "$OUT/baseline.json" --slow "$SLOW" --shard "$SHARD" --out "$OUT/results-${{ matrix.shard }}.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-value-results-${{ matrix.shard }}
          path: ${{ env.OUT }}/results-*
          retention-days: 30
          if-no-files-found: ignore

  report:
    name: report
    needs: [plan, mutants]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-value-*
          path: ${{ env.OUT }}
          merge-multiple: true
      - name: Count each test's kills and unique kills
        run: |
          python3 scripts/test-value.py report --sample "$SAMPLE" --mutants "$OUT/mutants.json" --baseline "$OUT/baseline.json" \
            --slow "$SLOW" --results "$OUT"/results-*.jsonl --out "$OUT/report"
          cat "$OUT/report/$SAMPLE-summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-value-report
          path: ${{ env.OUT }}/report
          retention-days: 30
