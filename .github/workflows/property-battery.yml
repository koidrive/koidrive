# SPDX-License-Identifier: Apache-2.0

name: Property battery

run-name: ${{ inputs.triage_run && format('Property battery triage of run {0}', inputs.triage_run) || format('Property battery on {0} ({1} shards x {2} stress cases)', github.ref_name, inputs.shards || '48', inputs.cases || '4096') }}

on:
  workflow_dispatch:
    inputs:
      filter:
        description: Test name filter passed to every property test binary (empty runs all their tests)
        type: string
        default: ''
      cases:
        description: Cases per opted-in stress property on each shard; other properties keep their own budgets (empty means 4096)
        type: string
        default: ''
      shards:
        description: Number of shards, each with its own seed, 1 to 256 (empty means 48)
        type: string
        default: ''
      mutations:
        description: Also run the mutation set in scripts/engine-mutations.sh
        type: boolean
        default: false
      triage_run:
        description: Skip the battery and triage the red shards of this earlier run id instead
        type: string
        default: ''
  schedule:
    - cron: '17 18 * * *'

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CASES: ${{ inputs.cases || '4096' }}
  SHARDS: ${{ inputs.shards || '48' }}
  FILTER: ${{ inputs.filter }}
  ONCE_PACKAGES: koidrive-chunk koidrive-engine koidrive-ignore koidrive-sim koidrive-test-support
  KOIDRIVE_SIM_REVIVED_DELETES: '1'

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build
    if: ${{ !inputs.triage_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      seed_base: ${{ steps.plan.outputs.seed_base }}
      shards: ${{ steps.plan.outputs.shards }}
      mutation_shards: ${{ steps.plan.outputs.mutation_shards }}
    steps:
      - name: Check the inputs
        run: |
          if [[ "$FILTER" == -* ]]; then
            echo "::error::filter must be a test name, not an option: '$FILTER' starts with '-', which the test binaries would read as a flag."
            exit 1
          fi
          if ! [[ "$CASES" =~ ^[1-9][0-9]{0,6}$ ]]; then
            echo "::error::cases must be a whole number from 1 to 9999999, got '$CASES'."
            exit 1
          fi
          if ! [[ "$SHARDS" =~ ^[1-9][0-9]{0,2}$ ]] || [ "$SHARDS" -gt 256 ]; then
            echo "::error::shards must be a whole number from 1 to 256 (the matrix limit), got '$SHARDS'."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: property-battery-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the property test binaries
        run: |
          cargo metadata --format-version 1 --locked --no-deps > "$RUNNER_TEMP/metadata.json"
          mapfile -t packages < <(jq -r '.packages[] | select(any(.dependencies[]; .name == "proptest")) | .name' "$RUNNER_TEMP/metadata.json")
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error::No workspace package depends on proptest, so there is nothing to run."
            exit 1
          fi
          echo "Packages with property tests: ${packages[*]}"
          for package in $ONCE_PACKAGES; do
            if [[ " ${packages[*]} " != *" $package "* ]]; then
              echo "::error::ONCE_PACKAGES names $package, which has no property tests. Remove it from the list."
              exit 1
            fi
          done
          args=()
          for package in "${packages[@]}"; do args+=(-p "$package"); done
          cargo test --locked --profile checked --no-run --tests --message-format=json-render-diagnostics "${args[@]}" > "$RUNNER_TEMP/build.json"
          scripts/require-runtime-checks.sh "$RUNNER_TEMP/build.json"
          filter_args=()
          if [ -n "$FILTER" ]; then filter_args=("$FILTER"); fi
          cargo run --quiet --locked --manifest-path scripts/check-proptest-persistence/Cargo.toml --target-dir target/check-proptest-persistence -- --list > "$RUNNER_TEMP/properties.tsv"
          mkdir -p battery/bin battery/every battery/once
          : > battery/targets.tsv
          : > "$RUNNER_TEMP/covered.txt"
          while IFS=$'\t' read -r manifest selector executable; do
            if [ ! -f "$executable.d" ]; then
              echo "::error::$executable has no dep-info file ($executable.d), so its source files are unknown."
              exit 1
            fi
            properties=$(sed -n 's/^\(.*\.rs\):$/\1/p' "$executable.d" | xargs -r realpath -m --relative-to="$GITHUB_WORKSPACE" | grep -v '^\.\./' | xargs -r grep -l 'proptest!' || true)
            [ -n "$properties" ] || continue
            echo "$properties" >> "$RUNNER_TEMP/covered.txt"
            package=$(jq -r --arg manifest "$manifest" '.packages[] | select(.manifest_path == $manifest) | .name' "$RUNNER_TEMP/metadata.json")
            dir=$(realpath --relative-to="$GITHUB_WORKSPACE" "$(dirname "$manifest")")
            binary="bin/$(basename "$executable")"
            cp "$executable" "battery/$binary"
            if ! listing=$(cd "$dir" && "$executable" --list "${filter_args[@]}"); then
              echo "::error::$package $selector: listing its tests with --list failed, so the battery cannot tell which tests it would run."
              exit 1
            fi
            every="battery/every/$(basename "$executable").txt"
            once="battery/once/$(basename "$executable").txt"
            if [[ " $ONCE_PACKAGES " == *" $package "* ]]; then spread=1; else spread=0; fi
            : > "$every"
            : > "$once"
            awk -F'\t' 'FILENAME == ARGV[1] { files[$0]; next } $1 in files { print $2 }' <(echo "$properties") "$RUNNER_TEMP/properties.tsv" | sort -u > "$RUNNER_TEMP/names.txt"
            sed -n 's/: test$//p' <<< "$listing" > "$RUNNER_TEMP/listed.txt"
            ambiguous=$(awk -F'::' 'FILENAME == ARGV[1] { names[$0]; next } $NF in names { seen[$NF]++ } END { for (name in seen) if (seen[name] > 1) print name }' "$RUNNER_TEMP/names.txt" "$RUNNER_TEMP/listed.txt" | sort)
            if [ -n "$ambiguous" ]; then
              echo "::error::$package $selector has several tests whose names end like these properties, so the battery cannot tell which one is the property: ${ambiguous//$'\n'/ }. Give each property a name that no other test in the binary ends with."
              exit 1
            fi
            unlisted=$(awk -F'::' '{ print $NF }' "$RUNNER_TEMP/listed.txt" | sort -u | comm -23 "$RUNNER_TEMP/names.txt" -)
            if [ -z "$FILTER" ] && [ -n "$unlisted" ]; then
              echo "::error::$package $selector compiles these properties but does not list them, so no shard would run them: ${unlisted//$'\n'/ }"
              exit 1
            fi
            awk -v every="$every" -v once="$once" -v spread="$spread" 'FILENAME == ARGV[1] { names[$0]; next } { n = split($0, path, "::"); if (spread && !(path[n] in names)) print > once; else print > every }' "$RUNNER_TEMP/names.txt" "$RUNNER_TEMP/listed.txt"
            every_count=$(wc -l < "$every")
            once_count=$(wc -l < "$once")
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$package" "$selector" "$dir" "$binary" "$every_count" "$once_count" >> battery/targets.tsv
            echo "$package $selector: $every_count tests on every shard, $once_count tests once; property files: ${properties//$'\n'/ }"
          done < <(jq -r 'select(.reason == "compiler-artifact" and .executable != null) | [.manifest_path, (if (.target.kind | any(. == "test")) then "--test " + .target.name elif (.target.kind | any(. == "bin")) then "--bin " + .target.name else "--lib" end), .executable] | @tsv' "$RUNNER_TEMP/build.json")
          missing=$(for package in "${packages[@]}"; do
            dir=$(jq -r --arg name "$package" '.packages[] | select(.name == $name) | .manifest_path' "$RUNNER_TEMP/metadata.json" | xargs dirname | xargs realpath --relative-to="$GITHUB_WORKSPACE")
            git ls-files -- "$dir" | grep '\.rs$' | xargs -r grep -l 'proptest!' || true
          done | sort -u | comm -23 - <(sort -u "$RUNNER_TEMP/covered.txt"))
          if [ -n "$missing" ]; then
            echo "::error::These files contain proptest! but no test binary of their package compiles them, so the battery would skip them: ${missing//$'\n'/ }"
            exit 1
          fi
          if [ ! -s battery/targets.tsv ]; then
            echo "::error::No test binary in ${packages[*]} compiles a file with a proptest! block."
            exit 1
          fi
          every=$(awk -F'\t' '{ n += $5 } END { print n + 0 }' battery/targets.tsv)
          selected=$(awk -F'\t' '{ n += $5 + $6 } END { print n + 0 }' battery/targets.tsv)
          if [ "$selected" -eq 0 ]; then
            echo "::error::The filter '$FILTER' selects no test in the property test binaries, so the battery would run nothing."
            exit 1
          fi
          {
            echo "### Property test targets"
            echo
            echo "$selected tests selected (filter: ${FILTER:-none}). Every shard runs $every tests with its own seed: each property test, and every test of the packages that ONCE_PACKAGES leaves out. The other $((selected - every)) tests, outside property blocks in $ONCE_PACKAGES, do not use the shard's seed, so each runs once, on one of the shards."
            echo
            awk -F'\t' '{ print "- " $1 " " $2 ": " $5 " tests on every shard, " $6 " tests once" }' battery/targets.tsv
          } | tee -a "$GITHUB_STEP_SUMMARY"
          tar -cf battery.tar battery
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: battery-binaries
          path: battery.tar
          retention-days: 1
          if-no-files-found: error
      - name: Plan the shards
        id: plan
        env:
          MUTATIONS: ${{ inputs.mutations }}
        run: |
          seed_base=$((GITHUB_RUN_ID * 1000))
          mutation_shards='[]'
          if [ "$MUTATIONS" = "true" ]; then
            if [ ! -x scripts/mutations.sh ]; then
              echo "::error::Commit $(git rev-parse HEAD) has no scripts/mutations.sh, so it has no mutation set to run. Test a commit that contains it, or run without mutations."
              exit 1
            fi
            count=$(scripts/mutations.sh --count)
            n=$(( count < SHARDS ? count : SHARDS ))
            mutation_shards=$(jq -cn --argjson n "$n" '[range($n)]')
            echo "Mutation set: $count mutations on $n shards."
          fi
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "seed_base=$seed_base"
            echo "shards=$(jq -cn --argjson n "$SHARDS" '[range($n)]')"
            echo "mutation_shards=$mutation_shards"
          } >> "$GITHUB_OUTPUT"
          echo "Commit $(git rev-parse HEAD), $SHARDS shards, KOIDRIVE_BATTERY_CASES=$CASES for opted-in stress properties; other properties keep their own budgets. Shard k uses PROPTEST_RNG_SEED=$seed_base + k."

  shard:
    name: shard ${{ matrix.shard }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.build.outputs.shards) }}
    env:
      SHA: ${{ needs.build.outputs.sha }}
      SEED_BASE: ${{ needs.build.outputs.seed_base }}
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: battery-binaries
      - name: Run the property tests
        run: |
          tar -xf battery.tar
          seed=$((SEED_BASE + SHARD))
          out="$RUNNER_TEMP/out"
          mkdir -p "$out/logs" "$out/regressions"
          echo "Shard $SHARD of $SHARDS: PROPTEST_RNG_SEED=$seed KOIDRIVE_BATTERY_CASES=$CASES for opted-in stress properties; filter='$FILTER' commit $SHA"
          passed=0 failed=0 failing='[]' offset=0 assigned=0
          while IFS=$'\t' read -r package selector dir binary _ once_count; do
            name=$(basename "$binary")
            awk -v shard="$SHARD" -v shards="$SHARDS" -v offset="$offset" '(NR - 1 + offset) % shards == shard' "battery/once/$name.txt" | cat "battery/every/$name.txt" - > "$out/tests-$name.txt"
            offset=$((offset + once_count))
            mapfile -t tests < "$out/tests-$name.txt"
            expected=${#tests[@]}
            [ "$expected" -gt 0 ] || continue
            assigned=$((assigned + expected))
            log="$out/logs/$name.log"
            echo "::group::$package $selector"
            set +e
            (cd "$dir" && env -u PROPTEST_CASES CARGO_MANIFEST_DIR="$GITHUB_WORKSPACE/$dir" PROPTEST_RNG_SEED="$seed" KOIDRIVE_BATTERY_CASES="$CASES" "$GITHUB_WORKSPACE/battery/$binary" --exact "${tests[@]}") 2>&1 | tee "$log"
            code=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            counts=$(sed -nE 's/^test result: [A-Za-z]+\. ([0-9]+) passed; ([0-9]+) failed; ([0-9]+) ignored.*/\1 \2 \3/p' "$log" | tail -n 1)
            read -r p f i <<< "${counts:-0 0 0}"
            passed=$((passed + p))
            failed=$((failed + f))
            echo "$package $selector: exit $code, $p passed, $f failed, $i ignored, $expected listed"
            reason=""
            if [ "$code" -ne 0 ]; then
              reason="exit code $code"
            elif [ $((p + f + i)) -ne "$expected" ]; then
              reason="ran $((p + f + i)) of the $expected tests listed for it"
            fi
            if [ -n "$reason" ]; then
              red=$(sed -nE 's/^test ([^ ]+) \.\.\. FAILED$/\1/p' "$log" | tr '\n' ' ')
              repro_tests=""
              [ -z "$red" ] || repro_tests=" -- --exact ${red% }"
              repro="git checkout $SHA && env -u PROPTEST_CASES KOIDRIVE_BATTERY_CASES=$CASES PROPTEST_RNG_SEED=$seed cargo test --locked --profile checked -p $package $selector$repro_tests"
              failing=$(jq -c --arg target "$package $selector" --arg log "$name" --arg reason "$reason" --arg repro "$repro" '. + [{target: $target, log: $log, reason: $reason, repro: $repro}]' <<< "$failing")
              echo "::error title=$package $selector failed on shard $SHARD::Seed $seed, stress budget $CASES, $reason. Reproduce: $repro"
            fi
          done < battery/targets.tsv
          if [ "$assigned" -gt 0 ] && [ "$passed" -eq 0 ] && [ "$failed" -eq 0 ] && [ "$failing" = '[]' ]; then
            failing='[{"target": "all targets", "reason": "no test ran", "repro": ""}]'
            echo "::error::Shard $SHARD ran no tests, so it checked nothing."
          fi
          git status --porcelain --untracked-files=all -- '*.proptest-regressions' '*/proptest-regressions/*.txt' '*.cases/*.txt' | cut -c4- | while read -r file; do
            cp --parents "$file" "$out/regressions/"
          done
          jq -n --argjson shard "$SHARD" --argjson seed "$seed" --argjson cases "$CASES" --argjson passed "$passed" --argjson failed "$failed" --argjson failing "$failing" \
            '{shard: $shard, seed: $seed, cases: $cases, passed: $passed, failed: $failed, failing: $failing}' > "$out/result-$SHARD.json"
          if [ "$failing" = '[]' ]; then
            echo "Shard $SHARD passed: $passed tests, seed $seed, stress budget $CASES generated cases per selected, opted-in stress property. Other properties keep their own budgets; tests outside property blocks run once per battery in the packages ONCE_PACKAGES names, and on every shard in the others." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          jq -r '.[] | .repro' <<< "$failing" > "$out/repro.txt"
          echo "$seed" > "$out/seed.txt"
          {
            echo "### Shard $SHARD failed"
            echo
            echo "Seed $seed, stress budget $CASES, commit \`$SHA\`. Other properties keep their own budgets; tests outside property blocks run once per battery in the packages ONCE_PACKAGES names, and on every shard in the others. The seed, repro commands, logs and new regression files are in the \`failure-shard-$SHARD\` artifact. Reproduce:"
            echo
            jq -r '.[] | "```sh\n\(.repro)\n```"' <<< "$failing"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: result-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/out/result-${{ matrix.shard }}.json
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: failure-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/out
          retention-days: 30
          if-no-files-found: warn

  mutations:
    name: mutations ${{ matrix.shard }}
    needs: build
    if: inputs.mutations
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.build.outputs.mutation_shards) }}
    env:
      MUTATION_SHARDS: ${{ strategy.job-total }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: property-battery-${{ hashFiles('Cargo.toml') }}
          save-if: false
      - name: Run the mutation set
        env:
          MUTATION_SEED: '0'
        run: |
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          set +e
          scripts/mutations.sh --shard "$SHARD/$MUTATION_SHARDS" 2>&1 | tee "$out/mutations-$SHARD.log"
          code=${PIPESTATUS[0]}
          set -e
          count() { grep -cE "^[^ ]+: $1" "$out/mutations-$SHARD.log" || true; }
          jq -n --argjson shard "$SHARD" --argjson caught "$(count caught)" --argjson survived "$(count SURVIVED)" --argjson stale "$(count STALE)" --argjson broken "$(count BROKEN)" --argjson code "$code" \
            '{shard: $shard, caught: $caught, survived: $survived, stale: $stale, broken: $broken, exit: $code}' > "$out/mutations-$SHARD.json"
          {
            echo "### Mutation shard $SHARD"
            echo
            echo '```'
            grep -E '^[^ ]+: (caught|SURVIVED|STALE|BROKEN)|^Baseline' "$out/mutations-$SHARD.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: result-mutations-${{ matrix.shard }}
          path: ${{ runner.temp }}/out/mutations-${{ matrix.shard }}.*
          retention-days: 7
          if-no-files-found: warn

  summary:
    name: summary
    needs: [build, shard, mutations]
    if: ${{ always() && !inputs.triage_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: result-*
          path: results
          merge-multiple: true
      - name: Summarize the shards
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.build.outputs.sha }}
          REF: ${{ github.ref_name }}
          BUILD: ${{ needs.build.result }}
          SHARD_RESULT: ${{ needs.shard.result }}
          MUTATIONS_RESULT: ${{ needs.mutations.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$BUILD" != "success" ]; then
            echo "::error::The build job ended with '$BUILD', so no shard ran. Open the build job's log for the cause: $RUN_URL"
            exit 1
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            --jq '.jobs[] | {name, url: .html_url, conclusion}' | jq -s 'map({(.name): .}) | add // {}' > jobs.json
          shopt -s nullglob
          results=(results/result-*.json)
          if [ "${#results[@]}" -gt 0 ]; then jq -s . "${results[@]}" > shards.json; else echo '[]' > shards.json; fi
          passing=$(jq '[.[] | select(.failing == [])] | length' shards.json)
          tests_passed=$(jq '[.[] | .passed] | add // 0' shards.json)
          tests_failed=$(jq '[.[] | .failed] | add // 0' shards.json)
          {
            echo "## Property battery"
            echo
            echo "Commit \`$SHA\` ($REF), $SHARDS shards, KOIDRIVE_BATTERY_CASES=$CASES, filter: ${FILTER:-none}."
            echo
            echo "- Shards passed: $passing of $SHARDS"
            echo "- Stress budget: $CASES generated cases per selected, opted-in stress property on each passing shard, $((CASES * passing)) in total; saved regressions also replay"
            echo "- Bounded properties keep their own case budgets; tests outside property blocks run once per battery, spread over the shards, in the packages ONCE_PACKAGES names, and on every shard in the others"
            echo "- Tests: $tests_passed passed and $tests_failed failed, summed over shards"
            echo
            echo "| Shard | Seed | Result | Tests passed | Tests failed | Job |"
            echo "|---|---|---|---|---|---|"
            for shard in $(seq 0 $((SHARDS - 1))); do
              job=$(jq -c --arg name "shard $shard" '.[$name] // {url: "", conclusion: "missing"}' jobs.json)
              url=$(jq -r .url <<< "$job")
              row=$(jq -r --argjson shard "$shard" '.[] | select(.shard == $shard) | "\(.seed) | \(if .failing == [] then "passed" else "**failed**: " + ([.failing[].target] | join(", ")) end) | \(.passed) | \(.failed)"' shards.json)
              if [ -z "$row" ]; then row="- | no result ($(jq -r .conclusion <<< "$job")) | - | -"; fi
              echo "| $shard | $row | [log]($url) |"
            done
            mutation_results=(results/mutations-*.json)
            if [ "${#mutation_results[@]}" -gt 0 ]; then
              echo
              jq -rs '"Mutations: \(map(.caught) | add) caught, \(map(.survived) | add) survived, \(map(.stale) | add) stale, \(map(.broken) | add) did not compile."' "${mutation_results[@]}"
            fi
            echo
            echo "Run: $RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SHARD_RESULT" != "success" ] || { [ "$MUTATIONS_RESULT" != "success" ] && [ "$MUTATIONS_RESULT" != "skipped" ]; }; then
            failed_shards=$(jq -r '[.[] | select(.failing != []) | .shard] | join(", ")' shards.json)
            echo "::error::Shards: $SHARD_RESULT (failed: ${failed_shards:-none recorded, see the table}), mutations: $MUTATIONS_RESULT. The job summary lists the seeds and repro commands."
            exit 1
          fi
          echo "All $SHARDS shards passed, $((CASES * passing)) generated cases budgeted per selected, opted-in stress property. Bounded properties keep their own budgets; tests outside property blocks run once per battery in the packages ONCE_PACKAGES names, and on every shard in the others."

  triage:
    name: triage
    needs: [build, shard]
    if: ${{ !cancelled() && (inputs.triage_run || needs.shard.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      cases: ${{ steps.collect.outputs.cases }}
      head: ${{ steps.collect.outputs.head }}
      base: ${{ steps.collect.outputs.base }}
    env:
      RUN: ${{ inputs.triage_run || github.run_id }}
    steps:
      - name: Check the run id
        run: |
          if ! [[ "$RUN" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::triage_run must be the numeric id of a property battery run, got '$RUN'."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: failure-shard-*
          path: failures
          run-id: ${{ env.RUN }}
          github-token: ${{ github.token }}
      - name: Collect the new cases
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq .head_sha)
          base=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$head" --jq .merge_base_commit.sha)
          gh api "repos/$GITHUB_REPOSITORY/contents/Cargo.toml?ref=$head" -H 'Accept: application/vnd.github.raw' > "$RUNNER_TEMP/head-Cargo.toml"
          mkdir -p failures
          python3 scripts/triage-battery.py collect --failures failures --run "$RUN" --head "$head" --base "$base" \
            --head-manifest "$RUNNER_TEMP/head-Cargo.toml" --fallback-manifest Cargo.toml --out cases.json
          {
            echo "head=$head"
            echo "base=$base"
            echo "cases=$(jq '.cases | length' cases.json)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: triage-cases
          path: cases.json
          retention-days: 30
          if-no-files-found: error

  triage-replay:
    name: triage replay on ${{ matrix.side }}
    needs: triage
    if: ${{ !cancelled() && needs.triage.result == 'success' && needs.triage.outputs.cases != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        side: [head, base]
    env:
      SIDE: ${{ matrix.side }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.triage.outputs[matrix.side] }}
          path: side
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        working-directory: side
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: side -> target
          shared-key: property-battery-${{ hashFiles('side/Cargo.toml') }}
          save-if: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: triage-cases
      - name: Replay each case alone
        run: python3 scripts/triage-battery.py replay --cases cases.json --side "$SIDE" --checkout side --out "replay-$SIDE.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: triage-replay-${{ matrix.side }}
          path: replay-${{ matrix.side }}.json
          retention-days: 30
          if-no-files-found: error

  triage-report:
    name: triage report
    needs: [triage, triage-replay]
    if: ${{ !cancelled() && needs.triage.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: triage-*
          path: triage
          merge-multiple: true
      - name: Compare the head with the base
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.triage_run || github.run_id }}
        run: |
          shopt -s nullglob
          status=0
          python3 scripts/triage-battery.py report --cases triage/cases.json --replays triage/replay-*.json --run-url "$RUN_URL" --out battery-triage || status=$?
          cat battery-triage/triage.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: battery-triage
          path: battery-triage
          retention-days: 30
          if-no-files-found: error
