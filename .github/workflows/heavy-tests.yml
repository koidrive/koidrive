# SPDX-License-Identifier: Apache-2.0

name: Heavy tests

run-name: Worker launcher stop-signal loop, 200 runs on ubuntu-latest

on:
  workflow_dispatch:

permissions: {}

jobs:
  loop:
    name: loop (${{ matrix.code }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - code: head
            ref: 17c03d043fb0d5bd4ab6cec505e76e3c945b7da7
            tests: >-
              python3 scripts/test-stress-test-servers.py StressTests.test_worker_timeout_kills_nested_process_groups StressTests.test_timeout_kills_processes &&
              python3 scripts/test-worker-launchers.py WorkerLaunchers.test_a_stop_signal_stops_the_tests_and_never_cuts_cleanup_short WorkerLaunchers.test_a_badly_timed_signal_or_a_stubborn_worker_leaves_nothing_behind
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - name: Run the tests 200 times, 8 at a time, beside 4 busy loops
        env:
          TESTS: ${{ matrix.tests }}
        run: |
          nproc
          for _ in 1 2 3 4; do timeout 3600 sh -c 'while :; do :; done' & done
          seq 1 200 | xargs -P 8 -I{} bash -c 'if bash -c "$TESTS" > "$RUNNER_TEMP/run-{}.log" 2>&1; then echo "run {} pass"; else echo "run {} FAIL"; tail -n 30 "$RUNNER_TEMP/run-{}.log"; fi' > results.txt || true
          grep -E '^run [0-9]+ FAIL' -A30 results.txt || true
          passed=$(grep -cE '^run [0-9]+ pass' results.txt || true)
          echo "$passed of 200 runs passed" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$passed" -eq 200 ]
