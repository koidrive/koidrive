# SPDX-License-Identifier: Apache-2.0

name: Heavy tests

run-name: Heavy tests of ${{ inputs.mode == 'macos-ui' && 'the macOS UI tests' || inputs.crate }}${{ inputs.test && format(' --test {0}', inputs.test) || '' }}${{ inputs.filter && format(' {0}', inputs.filter) || '' }} on ${{ inputs.ref || github.ref_name }} (${{ inputs.os }}, ${{ inputs.repeat || '1' }} runs)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to test (empty tests the ref the run starts from)
        type: string
        default: ''
      crate:
        description: Workspace package to test, such as koidrive-sim (empty with mode macos-ui)
        type: string
        default: ''
      test:
        description: Integration test target, as for cargo test --test (empty runs every target of the package)
        type: string
        default: ''
      filter:
        description: Test name filter, as for cargo test (empty runs every test of the selected targets)
        type: string
        default: ''
      cases:
        description: Cases per opted-in stress property; deadline-bound properties keep their own budgets (empty keeps each property's own count)
        type: string
        default: ''
      repeat:
        description: Number of times to run the selection on each OS, 1 to 100
        type: string
        default: '1'
      parallel:
        description: Repetitions running at once on the same host, 1 to 8
        type: string
        default: '1'
      mode:
        description: Cargo tests, fresh local Worker integration launchers, the vitest suite of server/ (crate koidrive-server; test filters test files, filter test names), or the macOS app's UI tests on a fresh runner per run
        type: choice
        options: [cargo, worker, server, macos-ui]
        default: cargo
      seed:
        description: PROPTEST_RNG_SEED of the first run; run k uses seed + k - 1 (empty derives it from the run ID)
        type: string
        default: ''
      features:
        description: Cargo features, comma-separated, such as koidrive-engine/serde
        type: string
        default: ''
      ignored:
        description: Also run the tests marked #[ignore]
        type: boolean
        default: false
      release:
        description: Build the tests with the release profile
        type: boolean
        default: false
      env:
        description: Extra environment for the tests, as space-separated NAME=value pairs, such as MODEL_TABLE_SLOTS=1500000000; PROPTEST_VERBOSE also turns off output capture
        type: string
        default: ''
      os:
        description: Operating systems to run on
        type: choice
        options: [both, ubuntu, macos]
        default: both

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CRATE: ${{ inputs.crate }}
  TEST: ${{ inputs.test }}
  FILTER: ${{ inputs.filter }}
  CASES: ${{ inputs.cases }}
  REPEAT: ${{ inputs.repeat || '1' }}
  SEED: ${{ inputs.seed }}
  FEATURES: ${{ inputs.features }}
  IGNORED: ${{ inputs.ignored }}
  PARALLEL: ${{ inputs.parallel || '1' }}
  MODE: ${{ inputs.mode || 'cargo' }}
  RELEASE: ${{ inputs.release }}
  EXTRA_ENV: ${{ inputs.env }}

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      seed: ${{ steps.plan.outputs.seed }}
      runs: ${{ steps.plan.outputs.runs }}
    steps:
      - name: Check the inputs
        env:
          REF: ${{ inputs.ref }}
          OS: ${{ inputs.os }}
        run: |
          errors=()
          [[ "$REF" != -* ]] || errors+=("ref must be a branch, tag or commit, not an option: '$REF'.")
          [[ "$MODE" == macos-ui || "$CRATE" =~ ^[A-Za-z0-9_-]+$ ]] || errors+=("crate must be a package name such as koidrive-sim, got '$CRATE'.")
          [[ "$TEST" =~ ^[A-Za-z0-9_-]*$ ]] || errors+=("test must be an integration test target name such as engine_sync, got '$TEST'.")
          [[ "$FILTER" != -* ]] || errors+=("filter must be a test name, not an option: '$FILTER' starts with '-'.")
          [[ "$CASES" =~ ^[0-9]{0,7}$ ]] || errors+=("cases must be empty or a whole number up to 9999999, got '$CASES'.")
          [[ "$REPEAT" =~ ^([1-9][0-9]?|100)$ ]] || errors+=("repeat must be a whole number from 1 to 100, got '$REPEAT'.")
          [[ "$PARALLEL" =~ ^[1-8]$ ]] || errors+=("parallel must be a whole number from 1 to 8, got '$PARALLEL'.")
          [[ "$MODE" == cargo || "$MODE" == worker || "$MODE" == server || "$MODE" == macos-ui ]] || errors+=("mode must be cargo, worker, server or macos-ui.")
          [[ "$MODE" != server ]] || [[ "$CRATE" == koidrive-server && "$PARALLEL" == 1 && -z "$FEATURES$CASES" && "$IGNORED" != true ]] || errors+=("server mode runs the vitest suite of server/: set crate to koidrive-server, and leave parallel at 1 and features, cases and ignored empty.")
          [[ "$MODE" != macos-ui || ( -z "$CRATE$TEST$FILTER$CASES$FEATURES$EXTRA_ENV$SEED" && "$PARALLEL" == 1 && "$RELEASE" != true && "$IGNORED" != true ) ]] || errors+=("macos-ui runs the whole UI test suite: leave crate, test, filter, cases, features, env, seed, parallel, release and ignored unset.")
          [[ "$MODE" != macos-ui || "$OS" != ubuntu ]] || errors+=("macos-ui runs on macOS runners: set os to macos or both.")
          if [ "$MODE" = worker ]; then
            case "$CRATE" in
              koidrive-net) worker_test=server ;;
              koidrive-driver) worker_test=sync ;;
              *) worker_test=; errors+=("worker mode supports koidrive-net and koidrive-driver.") ;;
            esac
            [[ -z "$TEST" || "$TEST" == "$worker_test" ]] || errors+=("worker mode runs --test $worker_test, not '$TEST'.")
          fi
          [[ "$SEED" =~ ^(0|[1-9][0-9]{0,14})?$ ]] || errors+=("seed must be empty or a whole number of at most 15 digits without leading zeros, got '$SEED'.")
          [[ "$FEATURES" =~ ^[A-Za-z0-9_/,-]*$ ]] || errors+=("features must be comma-separated feature names, got '$FEATURES'.")
          allowed='^((MODEL|GUARD_MODEL|KOIDRIVE|KOI)_[A-Z0-9_]+|RUST_BACKTRACE|RUST_LOG|RUST_TEST_THREADS|RUST_MIN_STACK|PROPTEST_VERBOSE)$'
          reserved='^(KOIDRIVE_BATTERY_CASES|KOIDRIVE_PROPTEST_DETERMINISTIC)$'
          [[ "$EXTRA_ENV" != *$'\n'* ]] || errors+=("env must be one line of NAME=value pairs.")
          [[ "$MODE" == cargo && "$PARALLEL" == 1 ]] || [[ "$RELEASE" != true && -z "$EXTRA_ENV" ]] || errors+=("release and env apply only with mode cargo and parallel 1.")
          read -ra pairs <<< "$EXTRA_ENV"
          for pair in ${pairs[@]+"${pairs[@]}"}; do
            if [[ ! "$pair" =~ ^([A-Z_][A-Z0-9_]*)=[^[:space:]]*$ ]]; then
              errors+=("env takes NAME=value pairs, not '$pair'.")
            elif [[ ! "${BASH_REMATCH[1]}" =~ $allowed || "${BASH_REMATCH[1]}" =~ $reserved ]]; then
              errors+=("env can't set ${BASH_REMATCH[1]}: it takes MODEL_*, GUARD_MODEL_*, KOIDRIVE_*, KOI_* and RUST_BACKTRACE, RUST_LOG, RUST_TEST_THREADS, RUST_MIN_STACK or PROPTEST_VERBOSE, and the cases input sets the case budget.")
            elif [[ "$pair" == PROPTEST_VERBOSE=* && ! "$pair" =~ ^PROPTEST_VERBOSE=[0-9]$ ]]; then
              errors+=("PROPTEST_VERBOSE takes a level from 0 to 9, such as 2, got '$pair'.")
            fi
          done
          for error in "${errors[@]}"; do echo "::error::$error"; done
          [ "${#errors[@]}" -eq 0 ]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Pin the commit and the seeds
        id: plan
        run: |
          sha=$(git rev-parse HEAD)
          seed=${SEED:-$((GITHUB_RUN_ID * 1000))}
          {
            echo "sha=$sha"
            echo "seed=$seed"
            echo "runs=[$(seq -s, 1 "$REPEAT")]"
          } >> "$GITHUB_OUTPUT"
          if [ "$MODE" = macos-ui ]; then
            echo "Commit $sha, $REPEAT runs of the macOS UI tests."
          else
            echo "Commit $sha, $REPEAT runs on each OS, run k uses PROPTEST_RNG_SEED=$seed + k - 1."
          fi

  test:
    name: test (${{ matrix.os }})
    needs: plan
    if: inputs.mode != 'macos-ui'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os == 'ubuntu' && '["ubuntu-latest"]' || inputs.os == 'macos' && '["macos-15"]' || '["ubuntu-latest","macos-15"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 340
    permissions:
      contents: read
    env:
      SHA: ${{ needs.plan.outputs.sha }}
      SEED_BASE: ${{ needs.plan.outputs.seed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: env.MODE == 'worker' || env.PARALLEL != '1'
        with:
          ref: ${{ github.sha }}
          path: .heavy-harness
          sparse-checkout: |
            scripts
            .github/actions
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        if: env.MODE != 'server'
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: env.MODE != 'server'
        with:
          shared-key: heavy-tests-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        if: env.MODE == 'worker' || env.MODE == 'server'
        with:
          package_json_file: server/package.json
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: env.MODE == 'worker' || env.MODE == 'server'
        with:
          node-version: 24
      - uses: ./.heavy-harness/.github/actions/pnpm-store
        if: env.MODE == 'worker'
      - name: Install the Worker dependencies
        if: env.MODE == 'worker' || env.MODE == 'server'
        working-directory: server
        run: pnpm install --frozen-lockfile && pnpm build:web
      - name: Build the tests
        if: env.MODE != 'server'
        run: |
          if ! cargo metadata --format-version 1 --locked --no-deps | jq -e --arg crate "$CRATE" 'any(.packages[]; .name == $crate)' > /dev/null; then
            echo "::error::$CRATE is not a package of the workspace at $SHA."
            exit 1
          fi
          if [ "$MODE" = worker ]; then
            case "$CRATE" in
              koidrive-net) TEST=server ;;
              koidrive-driver) TEST=sync ;;
            esac
          fi
          profile=()
          [ "$RELEASE" != "true" ] || profile=(--release)
          cargo test --locked --no-run ${profile[@]+"${profile[@]}"} -p "$CRATE" ${FEATURES:+--features "$FEATURES"} ${TEST:+--test "$TEST"}
      - name: Run parallel or Worker repetitions
        if: env.MODE == 'worker' || env.PARALLEL != '1'
        run: |
          python3 .heavy-harness/scripts/stress-test-servers.py \
            --root "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/heavy-tests" \
            --mode "$MODE" --crate "$CRATE" --test "$TEST" --filter "$FILTER" \
            --features "$FEATURES" --cases "$CASES" --ignored "$IGNORED" \
            --repeat "$REPEAT" --parallel "$PARALLEL" --seed "$SEED_BASE"
      - name: Run the tests
        if: env.MODE == 'cargo' && env.PARALLEL == '1'
        run: |
          read -ra pairs <<< "$EXTRA_ENV"
          for pair in ${pairs[@]+"${pairs[@]}"}; do
            export "${pair?}"
          done
          out="$RUNNER_TEMP/heavy-tests"
          mkdir -p "$out/logs" "$out/regressions"
          cargo_args=(--locked --no-fail-fast -p "$CRATE")
          [ "$RELEASE" != "true" ] || cargo_args+=(--release)
          [ -z "$FEATURES" ] || cargo_args+=(--features "$FEATURES")
          [ -z "$TEST" ] || cargo_args+=(--test "$TEST")
          test_args=()
          [ -z "$FILTER" ] || test_args+=("$FILTER")
          [ "$IGNORED" != "true" ] || test_args+=(--include-ignored)
          [ "${PROPTEST_VERBOSE:-0}" = 0 ] || test_args+=(--nocapture)
          unset PROPTEST_CASES KOIDRIVE_BATTERY_CASES
          [ -z "$CASES" ] || export KOIDRIVE_BATTERY_CASES="$CASES"
          repro_args=$(printf ' %q' "${cargo_args[@]}")
          repro_env=""
          [ "${#pairs[@]}" -eq 0 ] || repro_env=$(printf ' %q' "${pairs[@]}")
          [ "${#test_args[@]}" -eq 0 ] || repro_args+=" --$(printf ' %q' "${test_args[@]}")"
          repro="git checkout $SHA && env -u PROPTEST_CASES -u KOIDRIVE_BATTERY_CASES PROPTEST_RNG_SEED=<seed>${CASES:+ KOIDRIVE_BATTERY_CASES=$CASES}$repro_env cargo test$repro_args"
          {
            echo "### $RUNNER_OS: cargo test$repro_args"
            echo
            echo "Commit $SHA, stress budget KOIDRIVE_BATTERY_CASES=${CASES:-unset, so each property runs its own count}. Deadline-bound properties keep their own budgets; unit tests run once per repetition."
            echo
            echo "| Run | Seed | Result | Passed | Failed | Ignored | Minutes |"
            echo "|---|---|---|---|---|---|---|"
          } >> "$out/summary.md"
          green=0 red=0 broken=0 total_passed=0 total_failed=0
          : > "$out/failed-tests.txt"
          for run in $(seq 1 "$REPEAT"); do
            seed=$((10#$SEED_BASE + run - 1))
            log="$out/logs/run-$run.log"
            echo "::group::Run $run of $REPEAT, PROPTEST_RNG_SEED=$seed"
            started=$SECONDS
            set +e
            PROPTEST_RNG_SEED=$seed cargo test "${cargo_args[@]}" -- ${test_args[@]+"${test_args[@]}"} 2>&1 | tee "$log"
            code=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            minutes=$(( (SECONDS - started + 30) / 60 ))
            plain=$(sed -E $'s/\x1b\\[[0-9;]*[A-Za-z]//g' "$log")
            read -r passed failed ignored < <(sed -nE 's/^test result: [A-Za-z]+\. ([0-9]+) passed; ([0-9]+) failed; ([0-9]+) ignored.*/\1 \2 \3/p' <<< "$plain" | awk '{ p += $1; f += $2; i += $3 } END { print p + 0, f + 0, i + 0 }')
            binaries=$(grep -cE '^ *(Running |Doc-tests )' <<< "$plain" || true)
            results=$(grep -cE '^test result: ' <<< "$plain" || true)
            awk '/^failures:$/ { list = 1; next } list && /^    [^ ]/ { print substr($0, 5); next } { list = 0 }' <<< "$plain" >> "$out/failed-tests.txt"
            git status --porcelain --untracked-files=all -- '*.proptest-regressions' '*/proptest-regressions/*.txt' '*.cases/*.txt' | cut -c4- | while read -r file; do
              mkdir -p "$out/regressions/run-$run/$(dirname "$file")"
              cp "$file" "$out/regressions/run-$run/$file"
              if git ls-files --error-unmatch -- "$file" > /dev/null 2>&1; then
                git checkout --quiet -- "$file"
              else
                rm "$file"
              fi
            done
            total_passed=$((total_passed + passed))
            total_failed=$((total_failed + failed))
            if [ "$code" -eq 0 ] && [ $((passed + failed)) -gt 0 ]; then
              result=pass
              green=$((green + 1))
            elif [ "$code" -eq 0 ]; then
              result="ran no test"
              broken=$((broken + 1))
            elif [ "$failed" -gt 0 ] && [ "$results" -ge "$binaries" ]; then
              result=fail
              red=$((red + 1))
            else
              result="error: exit $code, $results of $binaries test binaries finished"
              broken=$((broken + 1))
            fi
            echo "| $run | $seed | $result | $passed | $failed | $ignored | $minutes |" >> "$out/summary.md"
            if [ "$result" != pass ]; then
              echo "::error title=Run $run: $result::Reproduce: ${repro/<seed>/$seed}"
            fi
          done
          {
            echo
            echo "**$green of $REPEAT runs passed, $red failed, $broken did not finish cleanly.** $total_passed tests passed and $total_failed failed across all runs."
            if [ -s "$out/failed-tests.txt" ]; then
              echo
              echo "| Failed test | Runs it failed in |"
              echo "|---|---|"
              sort "$out/failed-tests.txt" | uniq -c | sort -rn | while read -r count name; do printf '| <code>%s</code> | %s |\n' "$name" "$count"; done
            fi
            if [ $((red + broken)) -gt 0 ]; then
              echo
              echo "Reproduce a run with its seed from the table:"
              echo
              echo '```sh'
              echo "$repro"
              echo '```'
              echo
              echo "Each run starts from the case files in the commit, so its seed reproduces it on a clean checkout. The heavy-tests-$RUNNER_OS artifact holds this summary, each run's log, and under regressions/run-<k>/ the proptest case files run k saved. To replay a saved case, copy its file to the same path in the checkout and run the command with PROPTEST_CASES=0."
            fi
          } >> "$out/summary.md"
          tee -a "$GITHUB_STEP_SUMMARY" < "$out/summary.md"
          [ "$green" -eq "$REPEAT" ]
      - name: Run the server tests
        if: env.MODE == 'server'
        working-directory: server
        run: |
          out="$RUNNER_TEMP/heavy-tests"
          mkdir -p "$out/logs"
          selection=()
          [ -z "$TEST" ] || selection+=("$TEST")
          [ -z "$FILTER" ] || selection+=(-t "$FILTER")
          shown=$(printf ' %q' ${selection[@]+"${selection[@]}"})
          repro="git checkout $SHA && cd server && pnpm install --frozen-lockfile && pnpm build:web && pnpm exec vitest run$shown"
          {
            echo "### $RUNNER_OS: vitest run$shown in server/"
            echo
            echo "Commit $SHA."
            echo
            echo "| Run | Result | Passed | Failed | Seconds |"
            echo "|---|---|---|---|---|"
          } >> "$out/summary.md"
          green=0 red=0 broken=0
          : > "$out/failed-tests.txt"
          for run in $(seq 1 "$REPEAT"); do
            log="$out/logs/run-$run.log"
            report="$out/logs/run-$run.json"
            echo "::group::Run $run of $REPEAT"
            started=$SECONDS
            set +e
            pnpm exec vitest run --reporter=verbose --reporter=json --outputFile.json="$report" ${selection[@]+"${selection[@]}"} 2>&1 | tee "$log"
            code=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            read -r passed failed < <(jq -r '"\(.numPassedTests) \(.numFailedTests)"' "$report" 2>/dev/null || echo "0 0")
            jq -r '.testResults[].assertionResults[] | select(.status == "failed") | .fullName' "$report" >> "$out/failed-tests.txt" 2>/dev/null || true
            if [ "$code" -eq 0 ] && [ "$passed" -gt 0 ]; then
              result=pass
              green=$((green + 1))
            elif [ "$failed" -gt 0 ]; then
              result=fail
              red=$((red + 1))
            else
              result="error: exit $code"
              broken=$((broken + 1))
            fi
            echo "| $run | $result | $passed | $failed | $((SECONDS - started)) |" >> "$out/summary.md"
            [ "$result" = pass ] || echo "::error title=Run $run: $result::Reproduce: $repro"
          done
          {
            echo
            echo "**$green of $REPEAT runs passed, $red failed, $broken did not finish cleanly.**"
            if [ -s "$out/failed-tests.txt" ]; then
              echo
              echo "| Failed test | Runs it failed in |"
              echo "|---|---|"
              sort "$out/failed-tests.txt" | uniq -c | sort -rn | while read -r count name; do printf '| <code>%s</code> | %s |\n' "$name" "$count"; done
            fi
            echo
            echo "Slowest tests across all runs:"
            echo
            echo "| Test | Median ms | Max ms |"
            echo "|---|---|---|"
            jq -rs '[.[].testResults[].assertionResults[] | select(.duration != null) | {name: .fullName, ms: .duration}] | group_by(.name) | map({name: .[0].name, median: (map(.ms) | sort | if length % 2 == 1 then .[length / 2 | floor] else (.[length / 2 - 1] + .[length / 2]) / 2 end), max: (map(.ms) | max)}) | sort_by(-.max) | .[:15][] | "| <code>\(.name)</code> | \(.median | round) | \(.max | round) |"' "$out"/logs/run-*.json || true
            echo
            echo "Reproduce a run with: $repro"
            echo
            echo "The heavy-tests-$RUNNER_OS artifact holds each run's log and vitest JSON report."
          } >> "$out/summary.md"
          tee -a "$GITHUB_STEP_SUMMARY" < "$out/summary.md"
          [ "$green" -eq "$REPEAT" ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: heavy-tests-${{ runner.os }}
          path: ${{ runner.temp }}/heavy-tests
          retention-days: 7
          if-no-files-found: ignore

  macos-ui:
    name: macos ui (run ${{ matrix.run }})
    needs: plan
    if: inputs.mode == 'macos-ui'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        run: ${{ fromJSON(needs.plan.outputs.runs) }}
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    defaults:
      run:
        shell: bash
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: heavy-tests-macos-ui-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the Rust core and the Swift bindings, and generate the project
        run: scripts/build-ffi.sh && scripts/generate-project.sh
      - name: Run the UI tests against the fake core
        timeout-minutes: 15
        run: scripts/run-ui-tests.sh build/UITests.xcresult
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: heavy-tests-macos-ui-run-${{ matrix.run }}
          path: |
            apps/macos/build/UITests.xcresult
            apps/macos/build/UITests.log
          retention-days: 7
          if-no-files-found: ignore
