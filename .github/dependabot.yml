version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /
      - /core/ignore/fuzz
      - /scripts/check-proptest-persistence
      - /scripts/fn-docs
      - /scripts/test-split
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
    groups:
      pip-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
